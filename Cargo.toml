[package]
name = "autotrim"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
notify-rust = "4.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"
