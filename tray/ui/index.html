<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>autoTrim</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f3; --side: #ecece8; --card: #ffffff; --line: #e0e0db; --fg: #232522; --muted: #62675e; --faint: #696e64;
    --row-alt: #f0f2ed; --row-hover: #e3ebdf; --table-head: #e8ece3; --table-line: #d5dacf;
    --hover: #e7e9e2; --sel: #dfe8dd; --soft: #eaf2e9; --amber-soft: #f7f0e3; --barbg: #dcdcd7;
    --accent: #2f6f4e; --blue: #4a6fa5; --high: #c0392b; --med: #94621d; --low: #4a6fa5; --danger: #b03a2e;
    --k-agent: #2f6f4e; --k-browser: #4a6fa5; --k-app: #8a6d3b; --k-other: #8c8c88;
    font: 13px/1.5 -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --side: #161618; --card: #242427; --line: #303035; --fg: #ececec; --muted: #bdc1b7; --faint: #afb4a8; --accent: #92cba4; --blue: #9fbce6; --med: #e5bd79; --danger: #f59d91; --high: #f59d91; --low: #9fbce6; --soft: #29392e; --amber-soft: #3b3325;
            --row-alt: #303034; --row-hover: #38413a; --table-head: #34363a; --table-line: #45464c;
            --hover: #26262b; --sel: #303e34; --barbg: #333338; --k-agent: #5fa981; --k-browser: #7f9fd1; --k-app: #c2a068; --k-other: #8c8c90; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--muted); }
  button.confirm { border-color: var(--danger); color: var(--danger); }
  button.primary { border-color: var(--accent); color: var(--accent); }
  button[disabled] { opacity: .45; cursor: default; }
  input, select { font: inherit; padding: 6px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  input::placeholder { color: var(--muted); opacity: 1; }
  .icon { width: 16px; height: 16px; display: inline-block; vertical-align: -3px; flex: none; }
  .muted { color: var(--muted); } .faint { color: var(--faint); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }


  header { min-height: 83px; padding: 13px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 24px; align-items: center; background: var(--bg); }
  header .mem { display: grid; gap: 6px; width: 370px; max-width: 46%; }
  header .mem .lbl { display: flex; justify-content: space-between; gap: 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  header .mem .lbl b { font-weight: 650; font-size: 15px; }
  header .meter { height: 6px; border-radius: 3px; background: var(--barbg); overflow: hidden; display: flex; }
  header .meter i { display: block; height: 100%; }
  header .meter .used { background: var(--k-agent); } header .meter .comp { background: var(--k-app); }
  header .stat { white-space: nowrap; font-variant-numeric: tabular-nums; }
  header .stat b { font-weight: 600; }
  header .stat span { color: var(--muted); display: block; font-size: 11px; }
  header .sync { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  header .sync .txt { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  header .sync > svg { width: 14px; height: 14px; flex: none; transform: rotate(-90deg); }
  header .sync svg .track { fill: none; stroke: var(--barbg); stroke-width: 2.5; }
  header .sync svg .arc { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  header .sync svg.due .arc { animation: pulse 1.2s ease-in-out infinite; }
  header .sync svg.busy { animation: spin 1s linear infinite; }
  header .sync svg.busy .arc { stroke-dashoffset: 24 !important; transition: none; }
  header .sync button { padding: 2px 10px; font-size: 12px; }
  @keyframes pulse { 50% { opacity: .35; } }
  @keyframes spin { to { transform: rotate(270deg); } }

  .body { flex: 1; display: flex; min-height: 0; }

  nav { width: 213px; flex: none; overflow: hidden; background: var(--side); border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; }
  .nav-primary { flex: none; }
  .nav-holders { flex: 1; min-height: 0; overflow-y: auto; margin-bottom: 14px; }
  nav h3 { font-size: 11px; text-transform: none; letter-spacing: 0; color: var(--muted); margin: 21px 10px 7px; font-weight: 600; display: flex; justify-content: space-between; gap: 6px; }
  nav .item { display: grid; grid-template-columns: 8px 1fr auto; grid-template-areas: "dot name mem" ". cnt cnt"; column-gap: 9px; row-gap: 3px; align-items: center; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  nav .item:hover { background: var(--hover); }
  nav .item.sel { background: var(--sel); }
  nav .item.sel .name { font-weight: 600; }
  nav .item .dot { grid-area: dot; width: 8px; height: 8px; border-radius: 50%; background: var(--k-other); }
  nav .item .dot.agent { background: var(--k-agent); } nav .item .dot.browser { background: var(--k-browser); } nav .item .dot.app { background: var(--k-app); }
  nav .item .name { grid-area: name; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav .item .cnt { grid-area: cnt; color: var(--muted); font-size: 11px; white-space: nowrap; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; }
  nav .item .mem { grid-area: mem; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  nav .item.plain { grid-template-columns: 16px minmax(0, 1fr) auto; grid-template-areas: "icon name mem"; padding: 7px 10px; border-radius: 6px; }
  nav .item.plain .icon { grid-area: icon; color: var(--muted); }
  nav .item.plain.sel .icon { color: var(--accent); }
  nav .item.plain .name { font-size: 12px; }
  nav .item.plain .mem { color: var(--muted); font-size: 12px; }
  nav .badge { background: var(--barbg); color: var(--muted); border-radius: 9px; padding: 0 6px; font-size: 11px; font-weight: 600; }
  nav .more { display: block; padding: 8px 9px; border-radius: 6px; color: var(--muted); cursor: pointer; }

  main { flex: 1; overflow-y: auto; padding: 23px 25px 32px; min-width: 0; }
  main h1 { font-size: 21px; margin: 0; font-weight: 650; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  main h1 .pill { font-size: 10px; font-weight: 600; text-transform: none; letter-spacing: 0; padding: 2px 7px; border-radius: 9px; background: var(--barbg); color: var(--muted); }
  .sub { color: var(--muted); font-size: 12px; margin: 5px 0 22px; display: flex; gap: 14px; flex-wrap: wrap; }
  .sub b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
  h2 { font-size: 13px; text-transform: none; letter-spacing: 0; color: var(--fg); margin: 23px 0 10px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  h2 .tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .cards { display: grid; gap: 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .card .t { font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
  .card .t::before { content: "●"; }
  .card.high .t::before { color: var(--high); } .card.medium .t::before { color: var(--med); } .card.low .t::before { color: var(--low); }
  .card .t a { margin-left: auto; color: var(--blue); font-weight: 500; font-size: 12px; cursor: pointer; }
  .card .e { color: var(--muted); margin: 4px 0 0 20px; white-space: pre-line; }
  .card .a { margin: 6px 0 0 20px; }
  .note { color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 4px; }
  @media (max-width: 1100px) { .duo { grid-template-columns: 1fr; } }
  .card .h { font-weight: 600; display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; }
  .card .h .tag { margin-left: 0; }
  .card .h a { margin-left: auto; color: var(--blue); font-weight: 500; font-size: 12px; cursor: pointer; }
  .card label { display: block; margin: 3px 0; cursor: pointer; }
  .card label input { margin: 0 6px 0 0; vertical-align: -1px; }
  .card .row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .pending { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
  .pending div { display: flex; gap: 8px; justify-content: space-between; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; }
  th, td { text-align: left; vertical-align: middle; line-height: 1.5; }
  td.num { font-weight: 500; }
  .l1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .l2 { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { white-space: nowrap; }
  tr.gone td { opacity: .45; }
  .state.stale { color: var(--med); } .state.active { color: var(--accent); } .state.idle { color: var(--muted); }
  .tag { display: inline-block; font-size: 10px; text-transform: none; letter-spacing: 0; padding: 1px 5px; border-radius: 4px; background: var(--barbg); color: var(--muted); margin-left: 6px; vertical-align: 1px; }
  .tag.on { background: var(--soft); color: var(--accent); }
  .wrap { overflow-x: auto; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 2px 10px; cursor: pointer; }
  .chip.sel { border-color: var(--accent); color: var(--accent); }

  .sub a { margin-left: auto; color: var(--blue); cursor: pointer; font-size: 12px; }
  .sub .tag { margin-left: 4px; }
  .kbar { height: 8px; border-radius: 4px; background: var(--barbg); overflow: hidden; display: flex; }
  .kbar i { display: block; height: 100%; background: var(--k-other); }
  .legend { display: flex; gap: 12px 18px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--k-other); margin-right: 6px; }
  .legend b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
  .kbar i.agent, .legend i.agent { background: var(--k-agent); } .kbar i.browser, .legend i.browser { background: var(--k-browser); } .kbar i.app, .legend i.app { background: var(--k-app); }
  h2 small { margin-left: auto; color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12px; text-align: right; }
  .log > div { padding: 5px 0; border-bottom: 1px solid var(--line); }
  .log > div:last-child { border-bottom: 0; }
  .log code { font-size: 12px; }
  .history-entry .recovery-hint { margin-top: 4px; overflow-wrap: anywhere; }
  .history-entry .copy-command { display: inline-flex; align-items: baseline; gap: 12px; max-width: 100%; margin-top: 4px; padding: 5px 8px; white-space: normal; text-align: left; transition: background-color .16s ease, color .16s ease, border-color .16s ease; }
  .history-entry .copy-command:hover { background: var(--hover); }
  .history-entry .copy-command:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .history-entry .copy-command code { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; user-select: text; }
  .history-entry .copy-command span { flex: none; min-width: 65px; text-align: right; color: var(--muted); font-size: 11px; }
  .history-entry .copy-command.copied { border-color: var(--accent); background: var(--accent); color: #fff; animation: copy-pulse .4s ease-out; }
  .history-entry .copy-command.copied span { color: #fff; font-weight: 600; }
  @keyframes copy-pulse { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--k-agent) 45%, transparent); } to { box-shadow: 0 0 0 7px transparent; } }
  @media (prefers-reduced-motion: reduce) { .history-entry .copy-command { transition: none; } .history-entry .copy-command.copied { animation: none; } }
  .toast { position: fixed; right: 16px; bottom: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; max-width: 560px; box-shadow: 0 6px 24px rgba(0,0,0,.18); display: none; white-space: pre-line; z-index: 9; }

  [hidden] { display: none !important; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  html[data-list-input="pointer"] [data-list-control]:focus { outline: none; }
  a[data-goto]:hover { text-decoration: underline; }
  .memory-detail { display: flex; justify-content: space-between; gap: 8px; font-size: 10px; color: var(--muted); }
  header { flex: none; }
  header .sync { display: grid; grid-template-columns: 14px auto; justify-content: end; gap: 5px 7px; max-width: 230px; }
  header .sync button { grid-column: 2; justify-self: end; display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; }
  header .sync button .icon { width: 13px; height: 13px; }
  header .sync .txt { white-space: normal; text-align: right; font-size: 11px; }
  .nav-status { flex: none; border-top: 1px solid var(--line); padding: 14px 10px 2px; color: var(--muted); font-size: 11px; line-height: 1.9; }
  .nav-status a { display: block; }
  .nav-status .running { color: var(--accent); }
  .nav-status .status-dot { display: inline-block; width: 6px; height: 6px; margin-right: 5px; border-radius: 50%; background: currentColor; }
  .monitor-status { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: 500; color: var(--muted); background: var(--barbg); }
  .monitor-status.on { color: var(--accent); background: var(--soft); }
  .monitor-status .icon { width: 13px; height: 13px; }
  .advice-list { border: 1px solid var(--line); border-radius: 8px; background: var(--card); overflow: hidden; }
  .advice-row { padding: 17px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; border-bottom: 1px solid var(--line); }
  .advice-row:last-child { border-bottom: 0; }
  .advice-row .t { font-weight: 600; }
  .advice-row.high .t { color: var(--high); }
  .advice-row .e { max-width: 62ch; color: var(--muted); font-size: 12px; white-space: pre-line; margin-top: 5px; }
  .advice-row .impact { margin-top: 9px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .advice-row .impact b { color: var(--fg); font-size: 15px; }
  .advice-row .a { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .advice-row a { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 12px; color: var(--fg); white-space: nowrap; }
  .advice-row:first-child a { border-color: var(--accent); color: var(--accent); }
  .advice-row a:hover { background: var(--hover); text-decoration: none; }
  .observations { display: grid; gap: 8px; margin-top: 12px; }
  .observation { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 12px 13px; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); font-size: 12px; }
  .observation > .icon { margin-top: 2px; color: var(--blue); }
  .observation b { color: var(--fg); font-weight: 600; }
  .observation .e { margin-top: 3px; white-space: pre-line; }
  .observation a { color: var(--blue); white-space: nowrap; }
  .list-toolbar { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; margin: 15px 0 12px; }
  .list-toolbar .search { position: relative; flex: 1; min-width: 170px; }
  .list-toolbar .search .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .list-toolbar input[type=search] { width: 100%; padding-left: 33px; }
  .list-toolbar select { max-width: 180px; }
  .filter-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .filters { display: flex; gap: 4px; flex-wrap: wrap; }
  .filters button { background: transparent; border-color: transparent; padding: 4px 9px; font-size: 12px; color: var(--muted); }
  .filters button[aria-pressed=true] { background: var(--sel); color: var(--fg); }
  .list-callout { background: var(--soft); border: 1px solid var(--sel); border-radius: 8px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .list-callout p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  .scope { margin: 8px 0 11px; font-size: 12px; color: var(--muted); }
  .compact-section { container-type: inline-size; margin-top: 8px; }
  .compact-layout { display: grid; grid-template-columns: minmax(260px, 1fr) 250px; gap: 18px; align-items: start; }
  .compact-list { min-width: 0; }
  .compact-table { table-layout: fixed; border: 0; border-radius: 0; background: transparent; }
  .compact-table th { padding: 8px 7px; font-size: 10px; font-weight: 500; background: transparent; color: var(--muted); border-bottom: 1px solid var(--line); }
  .compact-table td { height: 53px; padding: 10px 7px; border-bottom: 1px solid var(--line); background: transparent; }
  .compact-table tbody tr:nth-child(even) { --row-bg: transparent; }
  .compact-table tbody tr { cursor: pointer; }
  .compact-table tbody tr:hover > td, .compact-table tbody tr:focus-within > td { background: var(--hover); }
  .compact-table tbody tr.inspected > td, .compact-table tbody tr.selected > td { background: var(--sel); }
  .compact-table tr.inspected > td:first-child { box-shadow: inset 2px 0 var(--accent); }
  .compact-table .check { width: 29px; padding-left: 4px; padding-right: 6px; }
  .compact-table .metric { width: 85px; font-size: 12px; }
  .compact-table input[type=checkbox] { width: 14px; height: 14px; margin: 0; padding: 0; vertical-align: middle; accent-color: var(--accent); cursor: pointer; }
  .compact-table .row-title { display: block; width: 100%; border: 0; border-radius: 2px; background: transparent; padding: 0; font-size: 12px; font-weight: 550; line-height: 1.5; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .compact-table .row-sub { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 10px; white-space: nowrap; color: var(--muted); }
  .compact-table .row-context { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .state-symbol { flex: none; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
  .state-symbol.stale { background: var(--med); }
  .state-symbol.active { background: var(--accent); }
  .compact-table .stale-time { flex: none; color: var(--med); font-variant-numeric: tabular-nums; font-weight: 500; margin-right: 2px; }
  .row-lock { display: inline-flex; color: var(--muted); }
  .row-lock .icon { width: 12px; height: 12px; }
  .list-inspector { min-width: 0; position: sticky; top: 0; padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
  .inspector-kind { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 10px; color: var(--muted); }
  .row-state { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .row-state.stale { color: var(--med); }
  .row-state.active { color: var(--accent); }
  .list-inspector h3 { font-size: 15px; font-weight: 600; line-height: 1.45; margin: 14px 0 5px; overflow-wrap: anywhere; }
  .list-inspector .context { color: var(--muted); font-size: 11px; margin: 0; overflow-wrap: anywhere; }
  .inspector-metric { font-size: 25px; font-weight: 600; margin: 20px 0; font-variant-numeric: tabular-nums; }
  .inspector-metric small { display: block; color: var(--muted); font-size: 10px; font-weight: 400; }
  .list-inspector dl { display: grid; gap: 10px; margin: 18px 0; font-size: 11px; }
  .list-inspector dl > div { display: grid; grid-template-columns: minmax(64px, .8fr) minmax(0, 1.2fr); gap: 12px; }
  .list-inspector dt { color: var(--muted); }
  .list-inspector dd { margin: 0; text-align: right; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .inspector-note { display: flex; gap: 8px; color: var(--muted); font-size: 10px; line-height: 1.6; margin: 15px 0; padding-top: 13px; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
  .inspector-note .icon { width: 13px; height: 13px; margin-top: 2px; }
  .inspector-actions { display: grid; gap: 7px; }
  .inspector-actions button { width: 100%; font-size: 11px; white-space: normal; }
  .list-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 14px; font-size: 11px; color: var(--muted); }
  .list-footer .list-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .list-footer button { font-size: 11px; }
  .compact-empty { padding: 28px 12px; text-align: center; color: var(--muted); border-block: 1px solid var(--line); }
  @container (max-width: 580px) { .compact-layout { grid-template-columns: minmax(0, 1fr); gap: 16px; } .list-inspector { position: static; } .list-inspector dl { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; } }
  @container (max-width: 390px) { .list-inspector dl { grid-template-columns: minmax(0, 1fr); } }


  .help { color: var(--muted); font-size: 12px; margin: 10px 0; }
  .help summary { cursor: pointer; }
  .help p { line-height: 1.6; }

<body>
<header id="head"><span class="muted">loading…</span></header>
<div class="body">
  <nav id="side" aria-label="autoTrim navigation"></nav>
  <main id="main"><span class="muted">loading…</span></main>
</div>
<div class="toast" id="toast" role="status"></div>
<dialog id="action-review" aria-labelledby="review-title" aria-describedby="review-description"></dialog>
<script>
function icon(name){const paths={lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',overview:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',ports:'<path d="M8 3v5m8-5v5M6 8h12v4a6 6 0 0 1-12 0V8zm6 10v3"/>',history:'<path d="M3 11a9 9 0 1 1 2 7M3 4v7h7m2-5v6l4 2"/>',settings:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--side)"/><circle cx="15" cy="17" r="3" fill="var(--side)"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',check:'<path d="m5 12 4 4L19 6"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/>',back:'<path d="m10 5-7 7 7 7M3 12h18"/>',resume:'<path d="M3 9a9 9 0 1 1 0 7M3 3v6h6m3-3v6l4 2"/>'};return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${paths[name]||paths.info}</svg>`}

const invoke = (...a) => window.__TAURI__.core.invoke(...a);
const GB = 1024 ** 3, MB = 1024 ** 2;
const bytes = b => b >= GB ? (b / GB).toFixed(1) + " GB" : b >= MB ? Math.round(b / MB) + " MB" : Math.round(b / 1024) + " KB";
const dur = s => { s = Math.max(0, Math.floor(s)); const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : m ? `${m}m` : `${s}s`; };
const pct = (n, d) => d ? Math.round(n * 100 / d) + "%" : "n/a";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : w.endsWith("s") ? "es" : "s"}`;
const kindTag = k => k === "chat" ? `<span class="tag" title="a conversation UI: keeps the whole exchange in the page and grows with it">chat</span>` : k === "local" ? `<span class="tag" title="served from this machine">local</span>` : "";
const AGENT_LABEL = { claude_code: "Claude Code", codex: "Codex", cursor_agent: "Cursor Agent", gemini_cli: "Gemini CLI", aider: "Aider", open_code: "OpenCode", copilot: "Copilot CLI", open_claw: "OpenClaw" };

const epochNow = () => Date.now() / 1000;

const state = { snap: null, src: null, log: [], settings: null, service: null, view: "overview", showAll: false, tabSort: "idle", tabFilter: "", tabProfile: "", sessSort: "rss", sessFilter: "", sessState: "all", tabState: "all", listState: new Map(), settingsBusy: false,
  // Things closed from here that the daemon's snapshot has not caught up with yet.
  gone: { tabs: new Set(), pids: new Set() } };
const armed = {};
const listModels = new Map();
let actionReview = null;
let settingsRevision = 0;
const goneTab = t => state.gone.tabs.has(t.id);
const goneSession = x => state.gone.pids.has(x.pid);

function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 8000); }

async function copyText(text) {
  if (navigator.clipboard?.writeText) {
    try { await navigator.clipboard.writeText(text); return; } catch (_) { /* Try the web view fallback below. */ }
  }
  // Some embedded web views do not expose the async Clipboard API.
  const active = document.activeElement;
  const input = document.createElement("textarea");
  input.value = text;
  input.readOnly = true;
  input.style.cssText = "position:fixed;top:0;left:-9999px";
  document.body.append(input);
  try {
    input.select();
    if (!document.execCommand("copy")) throw new Error("Copy failed");
  } finally {
    input.remove();
    active?.focus({ preventScroll: true });
  }
}

async function copyCommand(button) {
  if (button.classList.contains("copying")) return;
  const label = button.querySelector("span");
  clearTimeout(button._copyTimer);
  button.classList.remove("copied", "copy-feedback");
  button.classList.add("copying");
  button.setAttribute("aria-busy", "true");
  button.title = "Copy to clipboard";
  label.textContent = "Copying…";
  try {
    await copyText(button.querySelector("code").textContent);
    button.classList.add("copied");
    button.title = "Copied to clipboard";
    label.textContent = "✓ Copied!";
    toast("Copied to clipboard.");
  } catch (_) {
    label.textContent = "Try again";
    toast("Couldn't copy. Select the command and copy it manually.");
  } finally {
    button.removeAttribute("aria-busy");
    button.classList.remove("copying");
    button.classList.add("copy-feedback");
    button._copyTimer = setTimeout(() => {
      button.classList.remove("copied", "copy-feedback");
      button.title = "Copy to clipboard";
      label.textContent = "Copy";
    }, 2500);
  }
}

// Two-step buttons: the first click arms for five seconds, the second acts.
function twoStep(btn, key, run) {
  const label = btn.dataset.label ?? (btn.dataset.label = btn.textContent);
  const now = Date.now();
  if (!armed[key] || now - armed[key] > 5000) {
    armed[key] = now; btn.textContent = "Confirm"; btn.classList.add("confirm");
    setTimeout(() => { if (armed[key] === now) { btn.textContent = label; btn.classList.remove("confirm"); delete armed[key]; } }, 5000);
    return;
  }
  delete armed[key]; btn.disabled = true; btn.textContent = "…";
  run().catch(e => toast(String(e))).finally(afterAction);
}

// After an action: redraw at once with what is already known (the rows
// just closed say so), then scan for real instead of waiting on the
// daemon's next tick. Browsers write their session file a few seconds
// after a tab closes, so look a second time.
function afterAction() {
  renderAll(false);
  refresh({ fresh: true });
  setTimeout(() => refresh({ fresh: true }), 3500);
}

function report(recs) {
  const list = Array.isArray(recs) ? recs : [recs];
  toast(list.map(r => `${r.action.replace(/_/g, " ")} · ${r.target} · ${r.result}` + (r.resume ? `\n↩ ${r.resume}` : "")).join("\n\n"));
}

// ---- the holders list: everything the sidebar orders by memory ----
function holders(s) {
  return s.groups.map(g => {
    const browser = s.browsers.find(b => b.name === g.name);
    const sessions = g.kind === "agent" ? s.sessions.filter(x => g.pids.includes(x.pid)) : [];
    const kind = g.kind === "agent" ? "agent" : browser ? "browser" : g.kind === "app" ? "app" : "other";
    let count;
    if (kind === "agent") { const live = sessions.filter(x => !goneSession(x)), stale = live.filter(x => x.state === "stale").length; count = plural(live.length, "session") + (stale ? ` · ${stale} stale` : ""); }
    else if (browser) { const live = browser.tabs.filter(t => !goneTab(t)), stale = live.filter(t => isStale(browser, t)).length; count = live.length ? plural(live.length, "tab") + (stale ? ` · ${stale} stale` : "") : plural(g.procs, "proc"); }
    else count = plural(g.procs, "proc");
    return { key: "g:" + g.name, name: g.name, kind, rss: g.rss, cpu: g.cpu, procs: g.procs, pids: g.pids, app: g.app || null, count, group: g, browser, sessions };
  });
}
const holderByKey = key => holders(state.snap).find(h => h.key === key);


function renderHeader() {
  const sys = state.snap.system, total = sys.total_mem;
  const used = total > 0 ? Math.max(0, Math.min(100, sys.used_mem * 100 / total)) : 0;
  const comp = total > 0 && sys.compressed != null ? Math.max(0, Math.min(used, sys.compressed * 100 / total)) : 0;
  const detail = [sys.wired != null ? `${bytes(sys.wired)} wired` : "", sys.free_pct != null ? `${sys.free_pct}% free` : "", `up ${dur(sys.uptime_secs)}`].filter(Boolean).join(" · ");
  document.getElementById("head").innerHTML = `
    <div class="mem" title="${esc(detail)}"><div class="lbl"><span><b>${bytes(sys.used_mem)}</b> <span class="muted">of ${bytes(total)}</span></span><span class="muted">In use</span></div>
      <div class="meter" role="img" aria-label="${esc(`${bytes(sys.used_mem)} of ${bytes(total)} RAM in use`)}"><i class="used" style="width:${(used - comp).toFixed(1)}%"></i><i class="comp" style="width:${comp.toFixed(1)}%"></i></div>
      <div class="memory-detail"><span>${sys.compressed != null ? `Includes ${bytes(sys.compressed)} compressed` : "Physical memory"}</span><span>${bytes(Math.max(0, total - sys.used_mem))} unused</span></div></div>
    <div class="stat" title="${esc(`${bytes(sys.used_swap)} of ${bytes(sys.total_swap)} swap in use`)}"><b>${bytes(sys.used_swap)}</b><span>Swap on disk</span></div>
    <div class="stat" title="load ${sys.load_one.toFixed(1)} · ${sys.load_five.toFixed(1)} · ${sys.load_fifteen.toFixed(1)}"><b>${Math.round(sys.cpu_pct)}%</b><span>CPU</span></div>
    ${syncMarkup()}`;
  document.getElementById("sync-btn").onclick = () => refresh({ fresh: true });
}

// ---- the refresh bar: how old the numbers are and when the next ones land ----
const POLL_MS = 5000; // how often this window reads the daemon's snapshot
const sync = { lastPoll: 0, scans: 0 };
const nowSecs = () => Date.now() / 1000;

// Ages in seconds as of right now, against this machine's clock, so the
// text and the bar keep moving between polls. The bar follows the daemon's
// cycle while it runs; otherwise the window scans on its own every poll.
function syncInfo() {
  const src = state.src, running = !!src.daemon_running;
  const shown = Math.max(0, nowSecs() - state.snap.taken_at);
  const period = Math.max(1, running ? src.interval_secs : POLL_MS / 1000);
  const age = running && src.snapshot_taken_at != null ? Math.max(0, nowSecs() - src.snapshot_taken_at) : shown;
  return { running, shown, period, age, left: Math.max(0, period - age), due: age >= period, busy: sync.scans > 0 };
}

function syncText(i) {
  if (i.busy) return "scanning…";
  const ago = `updated ${dur(i.shown)} ago`;
  return i.running ? ago : `${ago} · no daemon, scanning every ${dur(i.period)}`;
}

// The daemon's cycle is a small ring next to the age: it fills as the next
// snapshot approaches, pulses when one is due, and spins while scanning.
const RING = 2 * Math.PI * 5.5;
const ringOffset = i => (RING * (1 - Math.min(1, i.age / i.period))).toFixed(2);
function syncMarkup() {
  const i = syncInfo();
  const tip = i.running ? `the daemon samples every ${dur(i.period)}${i.due ? " and its next snapshot is due" : `; the next lands in ${dur(i.left)}`}, and this window picks it up within ${dur(POLL_MS / 1000)}` : "no daemon snapshot to read, so this window scans on its own";
  return `<div class="sync" title="${esc(tip)}"><svg id="sync-ring" class="${i.busy ? "busy" : i.due ? "due" : ""}" viewBox="0 0 14 14"><circle class="track" cx="7" cy="7" r="5.5"/><circle class="arc" cx="7" cy="7" r="5.5" stroke-dasharray="${RING.toFixed(2)}" stroke-dashoffset="${ringOffset(i)}"/></svg><span class="txt" id="sync-txt">${esc(syncText(i))}</span><button id="sync-btn" ${i.busy ? "disabled" : ""} title="scan now instead of waiting for the daemon's next tick">${icon("resume")}Refresh</button></div>`;
}
// Once a second: move the text and the ring along, and poll on the usual
// cadence, or every second once the daemon's next snapshot is due so the ring
// resets the moment it lands.
function tickSync() {
  if (!state.snap || !state.src) return;
  const i = syncInfo();
  const txt = document.getElementById("sync-txt"), ring = document.getElementById("sync-ring");
  if (txt) txt.textContent = syncText(i);
  if (ring) { ring.classList.toggle("due", i.due && !i.busy); ring.lastElementChild.style.strokeDashoffset = ringOffset(i); }
  const since = Date.now() - sync.lastPoll;
  if (!i.busy && (since >= POLL_MS || (i.running && i.due && since >= 1000))) refresh();
}


function renderSide() {
  const s = state.snap;
  const hs = holders(s);
  const sel = k => state.view === k ? " sel" : "";
  const unmanaged = s.ports.filter(p => !p.owner_managed).length;
  let html = `<div class="nav-primary">
    <a class="item plain${sel("overview")}" data-view="overview">${icon("overview")}<span class="name">Overview</span><span class="mem">${s.advice.length ? `<span class="badge">${s.advice.length}</span>` : ""}</span></a>
    <a class="item plain${sel("ports")}" data-view="ports">${icon("ports")}<span class="name">Listening ports</span><span class="mem">${s.ports.length ? `<span class="badge" title="${unmanaged} unmanaged of ${s.ports.length} ports" aria-label="${unmanaged ? `${unmanaged} unmanaged ports` : `${s.ports.length} managed ports`}">${unmanaged || s.ports.length}</span>` : ""}</span></a>
    <a class="item plain${sel("actions")}" data-view="actions">${icon("history")}<span class="name">Actions</span><span class="mem"></span></a>
    <a class="item plain${sel("settings")}" data-view="settings">${icon("settings")}<span class="name">Settings</span><span class="mem">${autoModeWord()}</span></a>
    </div><div class="nav-holders"><h3>Largest holders <span style="font-weight:400;white-space:nowrap">Memory ↓</span></h3>`;
  const LIMIT = 20;
  const shown = state.showAll ? hs : hs.slice(0, LIMIT);
  html += shown.map(h => `<a class="item${sel(h.key)}" data-view="${esc(h.key)}" title="${esc(h.name)} · ${plural(h.procs, "process")} · ${pct(h.rss, s.system.total_mem)} of RAM · ${h.cpu.toFixed(1)}% cpu">
      <span class="dot ${h.kind}"></span><span class="name">${esc(h.name)}</span><span class="mem">${bytes(h.rss)}</span><span class="cnt">${esc(h.count)}</span></a>`).join("");
  if (hs.length > shown.length) html += `<span class="more" data-more="1">${hs.length - shown.length} more…</span>`;
  else if (state.showAll && hs.length > LIMIT) html += `<span class="more" data-more="0">show fewer</span>`;
  html += `</div><div class="nav-status"><span class="${state.src.daemon_running ? "running" : ""}">${state.src.daemon_running ? '<i class="status-dot" aria-hidden="true"></i>Running in background' : "Background monitor stopped"}</span><a href="#settings" data-view="settings">Auto mode ${esc(autoMode(state.settings).replace("preview", "in preview"))}</a></div>`;
  const nav = document.getElementById("side");
  const scroll = nav.querySelector(".nav-holders")?.scrollTop ?? 0;
  nav.innerHTML = html;
  nav.querySelector(".nav-holders").scrollTop = scroll;
  nav.querySelectorAll("[data-view]").forEach(a => { a.href = "#" + encodeURIComponent(a.dataset.view); if (a.dataset.view === state.view) a.setAttribute("aria-current", "page"); a.onclick = e => { e.preventDefault(); navigate(a.dataset.view); }; });
  nav.querySelectorAll("[data-more]").forEach(a => { a.setAttribute("role", "button"); a.tabIndex = 0; a.onclick = () => { state.showAll = a.dataset.more === "1"; renderSide(); }; a.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); a.click(); } }; });
}

// ---- views ----
function adviceTarget(a) {
  const s = state.snap;
  if (a.id === "stale_sessions") { const g = s.groups.find(g => g.kind === "agent" && s.sessions.some(x => x.state === "stale" && g.pids.includes(x.pid))); return g ? "g:" + g.name : null; }
  if (a.id === "old_servers") return "ports";
  if (a.id === "conversation_tabs") { const b = s.browsers.find(b => a.title.endsWith(" in " + b.name)); return b ? "g:" + b.name : null; }
  if (a.id.startsWith("page_growth:")) { const pid = +a.id.split(":")[2]; const b = s.browsers.find(b => (b.renderer_procs || []).some(r => r.pid === pid)); return b ? "g:" + b.name : null; }
  if (a.id === "browser_sprawl" || a.id === "heavy_app") { const g = s.groups.find(g => a.title.startsWith(g.name + " ")); return g ? "g:" + g.name : null; }
  if (a.id.startsWith("growth:g:") || a.id.startsWith("cpu:g:")) { const name = a.id.replace(/^(growth|cpu):g:/, ""); return s.groups.some(g => g.name === name) ? "g:" + name : null; }
  if (a.id.startsWith("growth:s:") || a.id.startsWith("cpu:s:")) { const pid = +a.id.split(":")[2]; const g = s.groups.find(g => g.kind === "agent" && g.pids.includes(pid)); return g ? "g:" + g.name : null; }
  return null;
}

function adviceCards(list) {
  if (!list.length) return `<div class="note">Nothing needs attention right now. autoTrim will keep monitoring.</div>`;
  return `<div class="advice-list">${list.map(a => {
    const target = adviceTarget(a);
    const estimate = ["browser_sprawl", "conversation_tabs"].includes(a.id);
    const recovery = a.recovery > 0 ? `<div class="impact"><b>${estimate ? "≈ " : ""}${bytes(a.recovery)}</b><span>${estimate ? "estimated memory" : "memory held"}</span></div>` : "";

// ---- the two switches: auto mode, and running in the background ----
function controlCards() {
  if (!state.settings || !state.service) return `<p class="note">Settings could not be read from the app.</p>`;

}
const autoMode = c => !c || !(c.auto_close_sessions || c.auto_stop_servers) ? "off" : c.auto_dry_run ? "preview" : "on";

}

// The file's settings are the switches; what the daemon is running with

// what is about to be closed.
function autoCard() {
  const c = state.settings, a = state.snap.auto, mode = autoMode(c), busy = state.settingsBusy;
  let html = `<div class="card settings-card"><div class="h">Auto mode <a data-goto="actions">View actions</a></div><div class="muted">Preview what autoTrim would close before turning automatic closing on.</div>`;
  if (c.config_error) html += `<p class="state stale">Settings could not be read; defaults are shown: ${esc(c.config_error)}</p>`;
  html += `<div class="mode-choices" role="group" aria-label="Auto mode">${[["off", "Off", "You close things"], ["preview", "Preview only", "Log, never close"], ["on", "On", "Warn, then close"]].map(([value, label, sub]) => `<label class="mode-choice"><input type="radio" name="auto-mode" data-auto-mode="${value}" ${mode === value ? "checked" : ""} ${busy || c.config_error ? "disabled" : ""}><span><b>${label}</b><small>${sub}</small></span></label>`).join("")}</div>`;
  html += `<p class="muted">${mode === "off" ? "Monitoring and advice continue. All closing stays manual." : mode === "preview" ? "Preview records what would have closed in Actions. Nothing is closed." : `Warns first, then waits ${dur(c.auto_grace_minutes * 60)}. Anything used during that time is spared.`}</p>`;
  for (const [key, label, checked, detail] of [["close_sessions", "Close stale agent sessions", c.auto_close_sessions, `Idle past ${dur(c.stale_after_secs ?? 21600)}, with transcript and CPU evidence.`], ["stop_servers", "Stop old local servers", c.auto_stop_servers, `Quiet dev servers open past ${dur(c.port_stale_after_secs ?? 86400)}.`]]) {
    html += `<div class="setting-row"><label><span>${label}<small class="muted" style="display:block">${detail}</small></span><input type="checkbox" data-auto="${key}" ${checked ? "checked" : ""} ${busy || mode === "off" || c.config_error ? "disabled" : ""}></label></div>`;
  }

  if (!state.src.daemon_running) html += `<p class="note">The background monitor is stopped. Start it below for auto mode to run.</p>`;

    if (!applied || busy) html += `<p class="muted" role="status">Applying… the background monitor picks up changes on its next sample.</p>`;

}

function backgroundCard() {

function filteredTabs(b) {
  const q = state.tabFilter.trim().toLowerCase(), idle = t => t.active ? -1 : t.idle_secs ?? -.5;
  return b.tabs.filter(t => !goneTab(t) && (!state.tabProfile || t.profile === state.tabProfile) && (state.tabState === "all" || state.tabState === "stale" && isStale(b, t) && !t.pinned || state.tabState === "chat" && t.kind === "chat") && (!q || [t.title, t.url, t.site].join(" ").toLowerCase().includes(q)))
    .sort((a, c) => state.tabSort === "site" ? a.site.localeCompare(c.site) || idle(c) - idle(a) : state.tabSort === "title" ? a.title.localeCompare(c.title) : state.tabSort === "window" ? a.window_id - c.window_id || a.index - c.index : idle(c) - idle(a));
}
function filterChips(kind, selected, choices) {
  return `<div class="filters" role="group" aria-label="Filter ${kind}s">${choices.map(([value, text]) => `<button data-${kind}-state="${value}" aria-pressed="${selected === value}">${text}</button>`).join("")}</div>`;
}
function autoModeValues(c, mode) {
  if (mode === "off") return { close_sessions: false, stop_servers: false };
  return { close_sessions: c.auto_close_sessions || !c.auto_stop_servers, stop_servers: c.auto_stop_servers, dry_run: mode === "preview" };
}
async function saveAuto(values) {
  if (state.settingsBusy) return;
  state.settingsBusy = true; ++settingsRevision; renderMain(true);
  try { state.settings = await invoke("set_auto", values); }
  catch (e) { toast(String(e)); }
  finally { state.settingsBusy = false; ++settingsRevision; renderSide(); renderMain(true); refresh(); }
}

// The dialog owns a frozen set of reviewed identities. Polling may update
// the app behind it, but never changes the user's targets or checkboxes.
function reviewSessions(list) {
  const targets = list.filter(canCloseSession).map(x => ({ id: x.pid, name: x.session_name || x.project || `Session ${x.pid}`, detail: [x.project, x.host, x.idle_secs != null ? `idle ${dur(x.idle_secs)}` : ""].filter(Boolean).join(" · "), rss: x.rss, startTime: x.start_time }));
  openReview("sessions", targets);
}
function reviewTabs(b, list) {
  const targets = list.filter(t => canCloseTab(b, t)).map(t => ({ id: t.id, name: t.title.trim() || t.url, detail: `${t.site} · ${b.open_profiles.find(p => p.dir === t.profile)?.label || t.profile}`, rss: b.per_tab_estimate || 0, url: t.url, profile: t.profile }));
  openReview("tabs", targets, b.name);
}
function reviewPorts(list) {
  const processes = new Map();
  list.filter(p => !p.owner_managed).forEach(p => {
    if (!processes.has(p.pid)) processes.set(p.pid, { id: p.pid, name: p.label || p.process, detail: `${p.owner} · ${p.process} (${p.pid}) · ports ${state.snap.ports.filter(port => port.pid === p.pid).map(port => port.port).join(", ")}`, rss: 0 });
  });
  openReview("ports", [...processes.values()]);
}
const reviewNoun = kind => kind === "tabs" ? "tab" : kind === "ports" ? "server" : "session";
const reviewVerb = kind => kind === "ports" ? "Stop" : "Close";
function openReview(kind, targets, browser = null) {
  if (actionReview || !targets.length) return;
  actionReview = { kind, targets, browser, selected: new Set(targets.map(t => t.id)), busy: false, returnView: state.view };
  const dialog = document.getElementById("action-review"), noun = reviewNoun(kind), verb = reviewVerb(kind);
  dialog.innerHTML = `<div class="review-content"><h2 id="review-title">${verb} these ${noun}s?</h2><p id="review-description">Review the exact targets below. Uncheck anything you want to keep.</p><div class="review-targets">${targets.map(t => `<label class="review-target"><input type="checkbox" data-review-target="${t.id}" checked><span><span class="l1">${esc(t.name)}</span><span class="l2" style="display:block">${esc(t.detail)}</span></span><span class="num">${t.rss ? `${kind === "tabs" ? "≈ " : ""}${bytes(t.rss)}` : ""}</span></label>`).join("")}</div><div class="review-total"><span id="review-count"></span><span id="review-memory"></span></div><div class="recovery-note">${icon("resume")}<span>${kind === "ports" ? "Stopping a server ends its process and closes all ports it owns. Restart it from the terminal or app that launched it." : kind === "tabs" ? "Use ⌘⇧T in the same browser profile to reopen a recently closed tab. Its URL is saved in Actions. Unsaved text may not be restored." : "Closing stops the session’s processes. Its transcript stays on disk. Available resume commands are saved in Actions."}</span></div><p>${kind === "ports" ? "Each process is checked again before stopping. Services managed by an app or the system are skipped." : kind === "tabs" ? "Pinned, active, or navigated tabs are skipped when checked before closing. Memory figures are estimates." : "Active sessions, app engines, and sessions whose process has changed are skipped when checked before closing."}</p><p id="review-status" role="status"></p><div class="review-actions"><button id="review-cancel" autofocus>Cancel</button><button class="primary" id="review-submit">${verb} ${plural(targets.length, noun)}</button></div></div>`;
  dialog.oncancel = event => { if (actionReview?.busy) event.preventDefault(); };
  dialog.onclose = () => { actionReview = null; };
  dialog.querySelectorAll("[data-review-target]").forEach(cb => cb.onchange = () => { cb.checked ? actionReview.selected.add(+cb.dataset.reviewTarget) : actionReview.selected.delete(+cb.dataset.reviewTarget); updateReviewTotal(); });
  document.getElementById("review-cancel").onclick = () => dialog.close();
  document.getElementById("review-submit").onclick = executeReview;
  updateReviewTotal(); dialog.showModal();
}
function updateReviewTotal() {
  const r = actionReview, chosen = r.targets.filter(t => r.selected.has(t.id));
  document.getElementById("review-count").textContent = `${plural(chosen.length, reviewNoun(r.kind))} selected`;
  const rss = chosen.reduce((n, t) => n + t.rss, 0);
  document.getElementById("review-memory").innerHTML = rss ? `<b>${r.kind === "tabs" ? "≈ " : ""}${bytes(rss)}</b> ${r.kind === "tabs" ? "estimated" : "held now"}` : "";
  const button = document.getElementById("review-submit");
  button.textContent = `${reviewVerb(r.kind)} ${plural(chosen.length, reviewNoun(r.kind))}`;
  button.disabled = !chosen.length || r.busy;
}
async function executeReview() {
  const r = actionReview;
  if (!r || r.busy || !r.selected.size) return;
  r.busy = true;
  const dialog = document.getElementById("action-review"), status = document.getElementById("review-status");
  dialog.querySelectorAll("button, input").forEach(el => el.disabled = true);
  status.textContent = `Checking the selected targets and ${r.kind === "ports" ? "stopping" : "closing"}…`;
  const targets = r.targets.filter(t => r.selected.has(t.id)), results = [];
  try {
    if (r.kind === "sessions" || r.kind === "ports") {
      for (const target of targets) {
        try {
          const record = r.kind === "ports" ? await invoke("stop_server", { pid: target.id, force: false }) : await invoke("close_session", { pid: target.id, expectedStartTime: target.startTime });
          if (r.kind === "sessions" && /^(terminated|killed|already gone)/.test(record.result)) state.gone.pids.add(target.id);
          results.push(record);
        } catch (e) { results.push({ target: target.name, result: `Skipped: ${e}` }); }
      }
    } else {
      const records = await invoke("close_tabs", { browser: r.browser, expectedTabs: targets.map(t => ({ id: t.id, url: t.url, profile: t.profile })) });
      records.forEach((record, i) => { if (/^(closed|not open any more|already gone)/.test(record.result)) state.gone.tabs.add(targets[i].id); });
      results.push(...records);
    }
    const ok = record => /^(terminated|killed|stopped|closed|already gone|not open any more)/.test(record.result);
    const completed = results.filter(ok).length, failed = results.filter(record => !ok(record));
    status.textContent = `${completed} of ${plural(targets.length, reviewNoun(r.kind))} ${r.kind === "ports" ? "stopped" : "closed"} or already gone.${failed.length ? "\n" + failed.map(record => `${record.target}: ${record.result}`).join("\n") : r.kind === "ports" ? " Results are in Actions." : " Recovery instructions are in Actions."}`;
    document.getElementById("review-submit").textContent = "View actions";
    document.getElementById("review-submit").disabled = false;
    document.getElementById("review-submit").onclick = () => { dialog.close(); navigate("actions"); };
    document.getElementById("review-cancel").textContent = "Done";
  } catch (e) {
    // A lost response can still mean the action ran. Do not offer an
    // automatic retry against stale targets; refresh and review again.
    status.textContent = `Could not complete the request: ${e}\nCheck Actions and refresh before trying again.`;
    document.getElementById("review-submit").textContent = "View actions";
    document.getElementById("review-submit").disabled = false;
    document.getElementById("review-submit").onclick = () => { dialog.close(); navigate("actions"); };
    document.getElementById("review-cancel").textContent = "Done";
  } finally {
    r.busy = false; document.getElementById("review-cancel").disabled = false; afterAction();
  }
}

refresh();
setInterval(tickSync, 1000);
</script>
