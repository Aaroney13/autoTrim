<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>autoTrim</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f3; --side: #ecece8; --card: #ffffff; --line: #e0e0db; --fg: #1c1c1c; --muted: #6e6e6a; --faint: #a3a39f;
    --hover: #e4e4df; --sel: #d8d8d2; --barbg: #dcdcd7;
    --accent: #2f6f4e; --blue: #4a6fa5; --high: #c0392b; --med: #b7791f; --low: #4a6fa5; --danger: #b03a2e;
    --k-agent: #2f6f4e; --k-browser: #4a6fa5; --k-app: #8a6d3b; --k-other: #8c8c88;
    font: 13px/1.45 -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --side: #161618; --card: #242427; --line: #303035; --fg: #ececec; --muted: #9c9c9c; --faint: #6b6b6f;
            --hover: #26262b; --sel: #32323a; --barbg: #333338; --k-agent: #5fa981; --k-browser: #7f9fd1; --k-app: #c2a068; --k-other: #8c8c90; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--muted); }
  button.confirm { border-color: var(--danger); color: var(--danger); }
  button.primary { border-color: var(--accent); color: var(--accent); }
  button[disabled] { opacity: .45; cursor: default; }
  input, select { font: inherit; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  .muted { color: var(--muted); } .faint { color: var(--faint); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }


  header { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 24px; align-items: center; background: var(--bg); }
  header .mem { display: grid; gap: 6px; width: 340px; max-width: 42%; }
  header .mem .lbl { display: flex; justify-content: space-between; gap: 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  header .mem .lbl b { font-weight: 600; }
  header .meter { height: 6px; border-radius: 3px; background: var(--barbg); overflow: hidden; display: flex; }
  header .meter i { display: block; height: 100%; }
  header .meter .used { background: var(--k-app); } header .meter .comp { background: var(--med); } header .meter .swapi { background: var(--high); }
  header .stat { white-space: nowrap; font-variant-numeric: tabular-nums; }
  header .stat b { font-weight: 600; }
  header .stat span { color: var(--muted); margin-left: 4px; }
  header .sync { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  header .sync .txt { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  header .sync svg { width: 14px; height: 14px; flex: none; transform: rotate(-90deg); }
  header .sync svg .track { fill: none; stroke: var(--barbg); stroke-width: 2.5; }
  header .sync svg .arc { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  header .sync svg.due .arc { animation: pulse 1.2s ease-in-out infinite; }
  header .sync svg.busy { animation: spin 1s linear infinite; }
  header .sync svg.busy .arc { stroke-dashoffset: 24 !important; transition: none; }
  header .sync button { padding: 2px 10px; font-size: 12px; }
  @keyframes pulse { 50% { opacity: .35; } }
  @keyframes spin { to { transform: rotate(270deg); } }

  .body { flex: 1; display: flex; min-height: 0; }

  nav { width: 248px; flex: none; overflow-y: auto; background: var(--side); border-right: 1px solid var(--line); padding: 8px 0 24px; }
  nav h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 14px 4px; font-weight: 600; }
  nav .item { display: grid; grid-template-columns: 8px 1fr auto; grid-template-areas: "dot name mem" ". cnt cnt"; column-gap: 8px; row-gap: 1px; align-items: center; padding: 5px 14px; cursor: pointer; }
  nav .item:hover { background: var(--hover); }
  nav .item.sel { background: var(--sel); }
  nav .item .dot { grid-area: dot; width: 8px; height: 8px; border-radius: 50%; background: var(--k-other); }
  nav .item .dot.agent { background: var(--k-agent); } nav .item .dot.browser { background: var(--k-browser); } nav .item .dot.app { background: var(--k-app); }
  nav .item .name { grid-area: name; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav .item .cnt { grid-area: cnt; color: var(--muted); font-size: 11px; white-space: nowrap; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; }
  nav .item .mem { grid-area: mem; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  nav .item.plain { grid-template-columns: 1fr auto; grid-template-areas: "name mem"; padding: 6px 14px 6px 30px; }
  nav .item.plain .mem { color: var(--muted); font-size: 12px; }
  nav .badge { background: var(--high); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11px; font-weight: 600; }
  nav .more { display: block; padding: 6px 14px 6px 30px; color: var(--muted); cursor: pointer; }

  main { flex: 1; overflow-y: auto; padding: 16px 22px 40px; min-width: 0; }
  main h1 { font-size: 17px; margin: 0; font-weight: 650; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  main h1 .pill { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 9px; background: var(--barbg); color: var(--muted); }
  .sub { color: var(--muted); margin: 4px 0 14px; display: flex; gap: 14px; flex-wrap: wrap; }
  .sub b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 0 8px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  h2 .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .cards { display: grid; gap: 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .card .t { font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
  .card .t::before { content: "●"; }
  .card.high .t::before { color: var(--high); } .card.medium .t::before { color: var(--med); } .card.low .t::before { color: var(--low); }
  .card .t a { margin-left: auto; color: var(--blue); font-weight: 500; font-size: 12px; cursor: pointer; }
  .card .e { color: var(--muted); margin: 4px 0 0 20px; white-space: pre-line; }
  .card .a { margin: 6px 0 0 20px; }
  .note { color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
  @media (max-width: 1100px) { .duo { grid-template-columns: 1fr; } }
  .card .h { font-weight: 600; display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; }
  .card .h .tag { margin-left: 0; }
  .card .h a { margin-left: auto; color: var(--blue); font-weight: 500; font-size: 12px; cursor: pointer; }
  .card label { display: block; margin: 3px 0; cursor: pointer; }
  .card label input { margin: 0 6px 0 0; vertical-align: -1px; }
  .card .row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .pending { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
  .pending div { display: flex; gap: 8px; justify-content: space-between; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  table.fixed { table-layout: fixed; }
  table.fixed td { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.fixed td:last-child { text-overflow: clip; padding-left: 4px; }
  td.main { max-width: 0; width: 100%; }
  .l1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .l2 { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { white-space: nowrap; }
  tr.gone td { opacity: .45; }
  .state.stale { color: var(--high); } .state.active { color: var(--accent); } .state.idle { color: var(--muted); }
  .tag { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; padding: 1px 5px; border-radius: 4px; background: var(--barbg); color: var(--muted); margin-left: 6px; vertical-align: 1px; }
  .tag.on { background: var(--accent); color: #fff; }
  .wrap { overflow-x: auto; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 2px 10px; cursor: pointer; }
  .chip.sel { border-color: var(--accent); color: var(--accent); }

  .sub a { margin-left: auto; color: var(--blue); cursor: pointer; font-size: 12px; }
  .sub .tag { margin-left: 4px; }
  .kbar { height: 8px; border-radius: 4px; background: var(--barbg); overflow: hidden; display: flex; }
  .kbar i { display: block; height: 100%; background: var(--k-other); }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 8px; color: var(--muted); }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--k-other); margin-right: 6px; }
  .legend b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
  .kbar i.agent, .legend i.agent { background: var(--k-agent); } .kbar i.browser, .legend i.browser { background: var(--k-browser); } .kbar i.app, .legend i.app { background: var(--k-app); }
  h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12px; }
  .log > div { padding: 5px 0; border-bottom: 1px solid var(--line); }
  .log > div:last-child { border-bottom: 0; }
  .log code { font-size: 12px; }
  .log .recovery-hint { margin-top: 4px; overflow-wrap: anywhere; }
  .log .copy-command { display: inline-flex; align-items: baseline; gap: 12px; max-width: 100%; margin-top: 4px; padding: 5px 8px; white-space: normal; text-align: left; transition: background-color .16s ease, color .16s ease, border-color .16s ease; }
  .log .copy-command:hover { background: var(--hover); }
  .log .copy-command:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .log .copy-command code { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; user-select: text; }
  .log .copy-command span { flex: none; min-width: 65px; text-align: right; color: var(--muted); font-size: 11px; }
  .log .copy-command.copied { border-color: var(--accent); background: var(--accent); color: #fff; animation: copy-pulse .4s ease-out; }
  .log .copy-command.copied span { color: #fff; font-weight: 600; }
  @keyframes copy-pulse { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--k-agent) 45%, transparent); } to { box-shadow: 0 0 0 7px transparent; } }
  @media (prefers-reduced-motion: reduce) { .log .copy-command { transition: none; } .log .copy-command.copied { animation: none; } }
  .toast { position: fixed; right: 16px; bottom: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; max-width: 560px; box-shadow: 0 6px 24px rgba(0,0,0,.18); display: none; white-space: pre-line; z-index: 9; }
</style>
</head>
<body>
<header id="head"><span class="muted">loading…</span></header>
<div class="body">
  <nav id="side"></nav>
  <main id="main"><span class="muted">loading…</span></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const invoke = (...a) => window.__TAURI__.core.invoke(...a);
const GB = 1024 ** 3, MB = 1024 ** 2;
const bytes = b => b >= GB ? (b / GB).toFixed(1) + " GB" : b >= MB ? Math.round(b / MB) + " MB" : Math.round(b / 1024) + " KB";
const dur = s => { s = Math.max(0, Math.floor(s)); const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : m ? `${m}m` : `${s}s`; };
const pct = (n, d) => d ? Math.round(n * 100 / d) + "%" : "n/a";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : w.endsWith("s") ? "es" : "s"}`;
const kindTag = k => k === "chat" ? `<span class="tag" title="a conversation UI: keeps the whole exchange in the page and grows with it">chat</span>` : k === "local" ? `<span class="tag" title="served from this machine">local</span>` : "";
const AGENT_LABEL = { claude_code: "Claude Code", codex: "Codex", cursor_agent: "Cursor Agent", gemini_cli: "Gemini CLI", aider: "Aider", open_code: "OpenCode", copilot: "Copilot CLI", open_claw: "OpenClaw" };

const epochNow = () => Date.now() / 1000;

const state = { snap: null, src: null, log: [], settings: null, service: null, view: "overview", showAll: false, tabSort: "idle", tabFilter: "", tabProfile: "", sessSort: "rss",
  // Things closed from here that the daemon's snapshot has not caught up with yet.
  gone: { tabs: new Set(), pids: new Set() } };
const armed = {};
const goneTab = t => state.gone.tabs.has(t.id);
const goneSession = x => state.gone.pids.has(x.pid);

function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 8000); }

async function copyText(text) {
  if (navigator.clipboard?.writeText) {
    try { await navigator.clipboard.writeText(text); return; } catch (_) { /* Try the web view fallback below. */ }
  }
  // Some embedded web views do not expose the async Clipboard API.
  const active = document.activeElement;
  const input = document.createElement("textarea");
  input.value = text;
  input.readOnly = true;
  input.style.cssText = "position:fixed;top:0;left:-9999px";
  document.body.append(input);
  try {
    input.select();
    if (!document.execCommand("copy")) throw new Error("Copy failed");
  } finally {
    input.remove();
    active?.focus({ preventScroll: true });
  }
}

async function copyCommand(button) {
  if (button.classList.contains("copying")) return;
  const label = button.querySelector("span");
  clearTimeout(button._copyTimer);
  button.classList.remove("copied", "copy-feedback");
  button.classList.add("copying");
  button.setAttribute("aria-busy", "true");
  button.title = "Copy to clipboard";
  label.textContent = "Copying…";
  try {
    await copyText(button.querySelector("code").textContent);
    button.classList.add("copied");
    button.title = "Copied to clipboard";
    label.textContent = "✓ Copied!";
    toast("Copied to clipboard.");
  } catch (_) {
    label.textContent = "Try again";
    toast("Couldn't copy. Select the command and copy it manually.");
  } finally {
    button.removeAttribute("aria-busy");
    button.classList.remove("copying");
    button.classList.add("copy-feedback");
    button._copyTimer = setTimeout(() => {
      button.classList.remove("copied", "copy-feedback");
      button.title = "Copy to clipboard";
      label.textContent = "Copy";
    }, 2500);
  }
}

// Two-step buttons: the first click arms for five seconds, the second acts.
function twoStep(btn, key, run) {
  const label = btn.dataset.label ?? (btn.dataset.label = btn.textContent);
  const now = Date.now();
  if (!armed[key] || now - armed[key] > 5000) {
    armed[key] = now; btn.textContent = "Confirm"; btn.classList.add("confirm");
    setTimeout(() => { if (armed[key] === now) { btn.textContent = label; btn.classList.remove("confirm"); delete armed[key]; } }, 5000);
    return;
  }
  delete armed[key]; btn.disabled = true; btn.textContent = "…";
  run().catch(e => toast(String(e))).finally(afterAction);
}

// After an action: redraw at once with what is already known (the rows
// just closed say so), then scan for real instead of waiting on the
// daemon's next tick. Browsers write their session file a few seconds
// after a tab closes, so look a second time.
function afterAction() {
  renderAll(false);
  refresh({ fresh: true });
  setTimeout(() => refresh({ fresh: true }), 3500);
}

function report(recs) {
  const list = Array.isArray(recs) ? recs : [recs];
  toast(list.map(r => `${r.action.replace(/_/g, " ")} · ${r.target} · ${r.result}` + (r.resume ? `\n↩ ${r.resume}` : "")).join("\n\n"));
}

// ---- the holders list: everything the sidebar orders by memory ----
function holders(s) {
  return s.groups.map(g => {
    const browser = s.browsers.find(b => b.name === g.name);
    const sessions = g.kind === "agent" ? s.sessions.filter(x => g.pids.includes(x.pid)) : [];
    const kind = g.kind === "agent" ? "agent" : browser ? "browser" : g.kind === "app" ? "app" : "other";
    let count;
    if (kind === "agent") { const live = sessions.filter(x => !goneSession(x)), stale = live.filter(x => x.state === "stale").length; count = plural(live.length, "session") + (stale ? ` · ${stale} stale` : ""); }
    else if (browser) { const live = browser.tabs.filter(t => !goneTab(t)), stale = live.filter(t => isStale(browser, t)).length; count = live.length ? plural(live.length, "tab") + (stale ? ` · ${stale} stale` : "") : plural(g.procs, "proc"); }
    else count = plural(g.procs, "proc");
    return { key: "g:" + g.name, name: g.name, kind, rss: g.rss, cpu: g.cpu, procs: g.procs, pids: g.pids, app: g.app || null, count, group: g, browser, sessions };
  });
}
const holderByKey = key => holders(state.snap).find(h => h.key === key);


function renderHeader() {
  const sys = state.snap.system, total = sys.total_mem;
  const used = Math.min(100, sys.used_mem * 100 / total);
  const comp = sys.compressed != null ? Math.min(used, sys.compressed * 100 / total) : 0;
  const swap = sys.used_swap > 0 ? Math.min(100 - used, sys.used_swap * 100 / total) : 0;
  const detail = [sys.compressed != null ? `${bytes(sys.compressed)} compressed` : "", sys.wired != null ? `${bytes(sys.wired)} wired` : "", sys.free_pct != null ? `${sys.free_pct}% free` : "",
    sys.total_swap ? `swap ${bytes(sys.used_swap)} of ${bytes(sys.total_swap)}` : "no swap", `up ${dur(sys.uptime_secs)}`].filter(Boolean).join(" · ");
  // The one figure beside the total: swap when any is in use, since that is
  // the pressure signal; otherwise how much is compressed.
  const side = sys.used_swap > 0 ? `<span class="state stale">${bytes(sys.used_swap)} swapped</span>` : sys.compressed != null ? `<span class="muted">${bytes(sys.compressed)} compressed</span>` : "";
  document.getElementById("head").innerHTML = `
    <div class="mem" title="${esc(detail)}"><div class="lbl"><span><b>${bytes(sys.used_mem)}</b> <span class="muted">of ${bytes(total)} in use</span></span>${side}</div>
      <div class="meter"><i class="used" style="width:${(used - comp).toFixed(1)}%"></i><i class="comp" style="width:${comp.toFixed(1)}%"></i><i class="swapi" style="width:${swap.toFixed(1)}%"></i></div></div>
    <div class="stat" title="load ${sys.load_one.toFixed(1)} · ${sys.load_five.toFixed(1)} · ${sys.load_fifteen.toFixed(1)}"><b>${Math.round(sys.cpu_pct)}%</b><span>cpu</span></div>
    ${syncMarkup()}`;
  document.getElementById("sync-btn").onclick = () => refresh({ fresh: true });
}

// ---- the refresh bar: how old the numbers are and when the next ones land ----
const POLL_MS = 5000; // how often this window reads the daemon's snapshot
const sync = { lastPoll: 0, scans: 0 };
const nowSecs = () => Date.now() / 1000;

// Ages in seconds as of right now, against this machine's clock, so the
// text and the bar keep moving between polls. The bar follows the daemon's
// cycle while it runs; otherwise the window scans on its own every poll.
function syncInfo() {
  const src = state.src, running = !!src.daemon_running;
  const shown = Math.max(0, nowSecs() - state.snap.taken_at);
  const period = Math.max(1, running ? src.interval_secs : POLL_MS / 1000);
  const age = running && src.snapshot_taken_at != null ? Math.max(0, nowSecs() - src.snapshot_taken_at) : shown;
  return { running, shown, period, age, left: Math.max(0, period - age), due: age >= period, busy: sync.scans > 0 };
}

function syncText(i) {
  if (i.busy) return "scanning…";
  const ago = `updated ${dur(i.shown)} ago`;
  return i.running ? ago : `${ago} · no daemon, scanning every ${dur(i.period)}`;
}

// The daemon's cycle is a small ring next to the age: it fills as the next
// snapshot approaches, pulses when one is due, and spins while scanning.
const RING = 2 * Math.PI * 5.5;
const ringOffset = i => (RING * (1 - Math.min(1, i.age / i.period))).toFixed(2);
function syncMarkup() {
  const i = syncInfo();
  const tip = i.running ? `the daemon samples every ${dur(i.period)}${i.due ? " and its next snapshot is due" : `; the next lands in ${dur(i.left)}`}, and this window picks it up within ${dur(POLL_MS / 1000)}` : "no daemon snapshot to read, so this window scans on its own";
  return `<div class="sync" title="${esc(tip)}"><svg id="sync-ring" class="${i.busy ? "busy" : i.due ? "due" : ""}" viewBox="0 0 14 14"><circle class="track" cx="7" cy="7" r="5.5"/><circle class="arc" cx="7" cy="7" r="5.5" stroke-dasharray="${RING.toFixed(2)}" stroke-dashoffset="${ringOffset(i)}"/></svg><span class="txt" id="sync-txt">${esc(syncText(i))}</span><button id="sync-btn" ${i.busy ? "disabled" : ""} title="scan now instead of waiting for the daemon's next tick">Refresh</button></div>`;
}
// Once a second: move the text and the ring along, and poll on the usual
// cadence, or every second once the daemon's next snapshot is due so the ring
// resets the moment it lands.
function tickSync() {
  if (!state.snap || !state.src) return;
  const i = syncInfo();
  const txt = document.getElementById("sync-txt"), ring = document.getElementById("sync-ring");
  if (txt) txt.textContent = syncText(i);
  if (ring) { ring.classList.toggle("due", i.due && !i.busy); ring.lastElementChild.style.strokeDashoffset = ringOffset(i); }
  const since = Date.now() - sync.lastPoll;
  if (!i.busy && (since >= POLL_MS || (i.running && i.due && since >= 1000))) refresh();
}


function renderSide() {
  const s = state.snap;
  const hs = holders(s);
  const sel = k => state.view === k ? " sel" : "";
  const unmanaged = s.ports.filter(p => !p.owner_managed).length;
  let html = `
    <a class="item plain${sel("overview")}" data-view="overview"><span class="name">Overview</span><span class="mem">${s.advice.length ? `<span class="badge">${s.advice.length}</span>` : ""}</span></a>
    <a class="item plain${sel("ports")}" data-view="ports"><span class="name">Listening ports</span><span class="mem">${unmanaged ? `${unmanaged} unmanaged` : s.ports.length || ""}</span></a>
    <a class="item plain${sel("actions")}" data-view="actions"><span class="name">Actions</span><span class="mem"></span></a>
    <a class="item plain${sel("settings")}" data-view="settings"><span class="name">Settings</span><span class="mem">${autoModeWord()}</span></a>
    <h3>Largest holders</h3>`;
  const LIMIT = 20;
  const shown = state.showAll ? hs : hs.slice(0, LIMIT);
  html += shown.map(h => `<a class="item${sel(h.key)}" data-view="${esc(h.key)}" title="${esc(h.name)} · ${plural(h.procs, "process")} · ${pct(h.rss, s.system.total_mem)} of RAM · ${h.cpu.toFixed(1)}% cpu">
      <span class="dot ${h.kind}"></span><span class="name">${esc(h.name)}</span><span class="mem">${bytes(h.rss)}</span><span class="cnt">${esc(h.count)}</span></a>`).join("");
  if (hs.length > shown.length) html += `<span class="more" data-more="1">${hs.length - shown.length} more…</span>`;
  else if (state.showAll && hs.length > LIMIT) html += `<span class="more" data-more="0">show fewer</span>`;
  const nav = document.getElementById("side");
  const scroll = nav.scrollTop;
  nav.innerHTML = html;
  nav.scrollTop = scroll;
  nav.querySelectorAll("[data-view]").forEach(a => a.onclick = () => { state.view = a.dataset.view; renderSide(); renderMain(true); });
  nav.querySelectorAll("[data-more]").forEach(a => a.onclick = () => { state.showAll = a.dataset.more === "1"; renderSide(); });
}

// ---- views ----
function adviceTarget(a) {
  const s = state.snap;
  if (a.id === "stale_sessions") { const g = s.groups.find(g => g.kind === "agent" && s.sessions.some(x => x.state === "stale" && g.pids.includes(x.pid))); return g ? "g:" + g.name : null; }
  if (a.id === "old_servers") return "ports";
  if (a.id === "conversation_tabs") { const b = s.browsers.find(b => a.title.endsWith(" in " + b.name)); return b ? "g:" + b.name : null; }
  if (a.id.startsWith("page_growth:")) { const pid = +a.id.split(":")[2]; const b = s.browsers.find(b => (b.renderer_procs || []).some(r => r.pid === pid)); return b ? "g:" + b.name : null; }
  if (a.id === "browser_sprawl" || a.id === "heavy_app") { const g = s.groups.find(g => a.title.startsWith(g.name + " ")); return g ? "g:" + g.name : null; }
  if (a.id.startsWith("growth:g:") || a.id.startsWith("cpu:g:")) { const name = a.id.replace(/^(growth|cpu):g:/, ""); return s.groups.some(g => g.name === name) ? "g:" + name : null; }
  if (a.id.startsWith("growth:s:") || a.id.startsWith("cpu:s:")) { const pid = +a.id.split(":")[2]; const g = s.groups.find(g => g.kind === "agent" && g.pids.includes(pid)); return g ? "g:" + g.name : null; }
  return null;
}

function adviceCards(list) {
  if (!list.length) return `<div class="card"><div class="muted">Nothing to do.</div></div>`;
  return list.map(a => { const t = adviceTarget(a); return `<div class="card ${a.severity}"><div class="t"><span>${esc(a.title)}</span>${t ? `<a data-goto="${esc(t)}">show ›</a>` : ""}</div><div class="e">${esc(a.evidence.join("\n"))}</div><div class="a">→ ${esc(a.action)}</div></div>`; }).join("");
}

function trendsTable(list) {
  if (!list.length) return "";
  return `<h2>Trends <small class="muted">over the last ${dur(Math.max(...list.map(t => t.span_secs)))}</small></h2><div class="wrap"><table>
    <tr><th>Name</th><th class="num">Now</th><th class="num">Change</th><th class="num">Rate / h</th><th class="num">CPU</th></tr>` +
    list.map(t => { const sg = t.growth >= 0 ? "+" : "−"; return `<tr><td>${esc(t.name)}</td><td class="num">${bytes(t.rss_now)}</td><td class="num">${sg}${bytes(Math.abs(t.growth))}</td><td class="num">${sg}${bytes(Math.abs(t.bytes_per_hour))}</td><td class="num" title="mean over the window; ${Math.round(t.rising_frac * 100)}% of samples rising">${t.cpu_mean.toFixed(0)}%</td></tr>`; }).join("") + `</table></div>`;
}

// ---- the two switches: auto mode, and running in the background ----
function controlCards() {
  if (!state.settings || !state.service) return `<p class="note">Settings could not be read from the app.</p>`;
  return `<div class="duo">${autoCard()}${backgroundCard()}</div>`;
}
const autoModeWord = () => { const c = state.settings; return !c ? "" : !(c.auto_close_sessions || c.auto_stop_servers) ? "" : c.auto_dry_run ? "dry run" : "auto"; };

// What auto mode has warned about and is waiting on, with the time left.
function pendingList(a) {
  const now = epochNow();
  return `<div class="pending">${a.pending.map(p => `<div><span class="l1" title="${esc(p.target + " · " + p.detail)}">${esc(p.target)} <span class="muted">· ${esc(p.detail)} · ${bytes(p.rss)}</span></span><span class="num state stale">${a.dry_run ? "would close" : "closing"} in ${dur(Math.max(0, p.due_at - now))}</span></div>`).join("")}</div>`;
}

// The overview's one line about the switches: their state, and anything
// auto mode is about to close. The switches themselves are in Settings.
function statusLine() {
  const c = state.settings, sv = state.service, src = state.src, a = state.snap.auto;
  if (!c || !sv) return "";
  const on = c.auto_close_sessions || c.auto_stop_servers;
  const mode = !on ? "off" : c.auto_dry_run ? "dry run" : "on";
  const daemon = sv.installed && sv.running ? ["login service", "on"] : src.daemon_running ? ["foreground", ""] : ["not running", ""];
  const pending = a && a.pending.length ? `<span class="state stale">${plural(a.pending.length, "pending close")}</span>` : "";
  return `<span>auto mode<span class="tag ${on && !c.auto_dry_run ? "on" : ""}">${mode}</span></span><span>daemon<span class="tag ${daemon[1]}">${daemon[0]}</span></span>${pending}<a data-goto="settings">Settings ›</a>`;
}

// The file's settings are the switches; what the daemon is running with
// (the snapshot's `auto`) says whether they have been picked up yet and
// what is about to be closed.
function autoCard() {
  const c = state.settings, a = state.snap.auto, src = state.src;
  const on = c.auto_close_sessions || c.auto_stop_servers;
  const mode = !on ? "off" : c.auto_dry_run ? "dry run" : "on";
  const box = (key, label, checked, title) => `<label title="${esc(title)}"><input type="checkbox" data-auto="${key}" ${checked ? "checked" : ""}>${label}</label>`;
  let html = `<div class="card"><div class="h">Auto mode <span class="tag ${on && !c.auto_dry_run ? "on" : ""}">${mode}</span><a data-goto="actions">log ›</a></div>`;
  if (c.config_error) html += `<div class="state stale" style="margin-bottom:6px">config.toml could not be read, so these are the defaults: ${esc(c.config_error)}</div>`;
  html += box("close_sessions", "Close stale agent sessions", c.auto_close_sessions, "sessions idle by their own transcript for longer than the stale threshold, quiet, under an allowed host, and never the newest in a project")
    + box("stop_servers", "Stop old local servers", c.auto_stop_servers, "quiet listeners open for over a day whose owner is a known dev runtime (node, python, ruby, …), started from a terminal rather than an app")
    + box("dry_run", "Dry run: log and notify, close nothing", c.auto_dry_run, "the way to try it for a week; every would-be close lands in the Actions list");
  html += `<div class="muted" style="margin-top:6px">Warns first, then waits ${dur(c.auto_grace_minutes * 60)}; anything used in between is spared. Never the newest session in a project, never a host outside ${esc(c.auto_hosts.join(", "))}. The rest is in config.toml.</div>`;
  if (!src.daemon_running) html += `<div class="muted" style="margin-top:6px">Auto mode runs inside the daemon, and no daemon is running.</div>`;
  else if (a) {
    const applied = a.close_sessions === c.auto_close_sessions && a.stop_servers === c.auto_stop_servers && a.dry_run === c.auto_dry_run;
    if (!applied) html += `<div class="muted" style="margin-top:6px">Applying… the daemon picks changes up on its next tick.</div>`;
    else if (a.pending.length) html += pendingList(a);
    else if (on) html += `<div class="muted" style="margin-top:6px">Nothing is waiting to be closed.</div>`;
  }
  const dry = state.log.filter(r => r.mode === "dry-run");
  if (dry.length) html += `<div class="muted" style="margin-top:6px">Dry run so far: ${plural(dry.length, "would-be close")} among the last ${state.log.length} logged actions, about ${bytes(dry.reduce((n, r) => n + (r.rss || 0), 0))}.</div>`;
  return html + `</div>`;
}

function backgroundCard() {
  const sv = state.service, src = state.src, c = state.settings;
  let status, buttons = "";
  if (!sv.supported) status = "The login service is macOS only so far; run <code>autotrim daemon</code> under your own supervisor.";
  else if (sv.installed && sv.running) { status = `Running as a login service${sv.pid ? ` (pid ${sv.pid})` : ""}, started at every login${sv.binary ? `, from ${esc(sv.binary)}` : ""}.`; buttons = `<button data-service="restart" title="restart the daemon, for example after rebuilding it">Restart</button> <button data-service="uninstall" title="stop the daemon and remove the login service; data is kept">Stop login service</button>`; }
  else if (sv.installed) { status = "The login service is installed but the daemon is not running."; buttons = `<button class="primary" data-service="restart">Start</button> <button data-service="uninstall">Remove login service</button>`; }
  else if (src.daemon_running) { status = "A daemon is running in the foreground, in a terminal. As a login service it would outlive that terminal and start at every login."; buttons = `<button class="primary" data-service="install">Run in background</button>`; }
  else { status = "Nothing is running in the background, so this window scans on its own: no trends, no reminders, no auto mode. Run in background installs the daemon as a login service."; buttons = `<button class="primary" data-service="install">Run in background</button>`; }
  const tag = sv.installed && sv.running ? `<span class="tag on">login service</span>` : src.daemon_running ? `<span class="tag">foreground</span>` : `<span class="tag">not running</span>`;
  return `<div class="card"><div class="h">In the background ${tag}</div>
    <div class="muted">${status}</div>
    <div class="row2">${buttons}</div>
    <label style="margin-top:8px" title="off: the app starts as a menu bar item only; Open autoTrim… in its menu brings the window back"><input type="checkbox" data-launch-window ${c.open_window_at_launch ? "checked" : ""}>Open this window when the app starts</label>
    <div class="row2"><button data-hide>Hide window</button><span class="muted">The menu bar item stays. The daemon keeps working with the window closed, and with the app quit.</span></div></div>`;
}


function viewOverview() {
  const s = state.snap, a = s.auto;
  const trends = (s.trends || []).filter(t => t.kind !== "renderer" && t.span_secs >= 600).slice(0, 8);
  return `<h1>Overview</h1>
    <div class="sub"><span><b>${plural(s.sessions.filter(x => !goneSession(x)).length, "agent session")}</b></span><span><b>${plural(s.browsers.reduce((n, b) => n + b.tabs.filter(t => !goneTab(t)).length, 0), "browser tab")}</b></span>${statusLine()}</div>
    ${a && a.pending.length ? `<div class="card">${pendingList(a)}</div>` : ""}
    <h2>Advice</h2><div class="cards">${adviceCards(s.advice)}</div>
    ${kindBar()}
    ${trendsTable(trends)}
    ${!state.src.daemon_running ? `<p class="note" style="margin-top:16px">The daemon is not running, so this window is scanning on its own and there are no trends. Start it from Settings.</p>` : (trends.length ? "" : `<p class="note" style="margin-top:16px">Trends appear once the daemon has about ten minutes of history.</p>`)}`;
}

// One bar for what the sidebar lists, added up by kind.
function kindBar() {
  const sum = {};
  for (const h of holders(state.snap)) sum[h.kind] = (sum[h.kind] || 0) + h.rss;
  const total = Object.values(sum).reduce((n, v) => n + v, 0);
  if (!total) return "";
  const kinds = [["agent", "Agent sessions"], ["browser", "Browsers"], ["app", "Apps"], ["other", "Other processes"]].filter(([k]) => sum[k]);
  return `<h2>By kind <small class="muted">${plural(state.snap.groups.length, "holder")}, as the sidebar lists them</small></h2><div class="card">
    <div class="kbar">${kinds.map(([k]) => `<i class="${k}" style="width:${(sum[k] * 100 / total).toFixed(1)}%"></i>`).join("")}</div>
    <div class="legend">${kinds.map(([k, l]) => `<span><i class="${k}"></i>${l} <b>${bytes(sum[k])}</b></span>`).join("")}</div></div>`;
}

function viewSettings() {
  return `<h1>Settings</h1><div class="sub"><span>Auto mode and running in the background. Everything else is in config.toml.</span></div>${controlCards()}`;
}

function sessionRows(list) {
  const sort = state.sessSort;
  list = list.slice().sort((a, b) => sort === "idle" ? ((b.idle_secs ?? b.quiet_for_secs ?? -1) - (a.idle_secs ?? a.quiet_for_secs ?? -1)) : sort === "age" ? b.age_secs - a.age_secs : sort === "name" ? String(a.session_name ?? a.project).localeCompare(String(b.session_name ?? b.project)) : b.rss - a.rss);
  return list.map(x => {
    const gone = goneSession(x);
    const since = x.idle_secs != null ? `idle ${dur(x.idle_secs)}` : (x.quiet_for_secs ? `quiet ${dur(x.quiet_for_secs)}` : "");
    const st = gone ? "closed" : x.state === "active" ? "active" : x.state === "idle" ? (since || "idle") : (since ? `stale · ${since}` : "stale");
    const name = x.session_name || x.project || "?";
    const sub = [x.project, x.host, `pid ${x.pid}`].filter(Boolean);
    if (x.first_prompt && x.first_prompt !== name) sub.unshift(x.first_prompt);
    const can = !x.is_self && x.state !== "active" && !gone && !x.engine;
    const engineNote = `${x.host}'s own agent engine: it serves the threads the app shows and the app restarts it if closed. Close threads in the app instead.`;
    return `<tr class="${gone ? "gone" : x.state}"><td class="main"><div class="l1" title="${esc(name)}">${esc(name)}${x.is_self ? `<span class="tag on">this app</span>` : ""}${x.engine ? `<span class="tag" title="${esc(engineNote)}">app engine</span>` : ""}</div><div class="l2" title="${esc(sub.join(" · "))}">${esc(sub.join(" · "))}</div></td>
      <td class="state ${gone ? "idle" : x.state}">${esc(st)}</td><td class="num">${dur(x.age_secs)}</td><td class="num">${(x.cpu_window_mean ?? x.cpu).toFixed(1)}%</td><td class="num">${bytes(x.rss)}</td><td class="num muted">${x.ports.join(", ") || "–"}</td>
      <td class="num"><button ${can ? "" : "disabled"} data-close-session="${x.pid}" title="${x.is_self ? "this is the session running autoTrim" : x.engine ? esc(engineNote) : x.state === "active" ? "busy right now" : "close it; the transcript stays and the resume command is logged"}">Close</button></td></tr>`;
  }).join("");
}

function viewAgents(h) {
  const s = state.snap;
  const live = h.sessions.filter(x => !goneSession(x));
  const stale = live.filter(x => x.state === "stale" && !x.is_self && !x.engine);
  const trend = (s.trends || []).find(t => t.key === "g:" + h.name && t.span_secs >= 600);
  // The group's memory less its sessions' is the folded-in app's own.
  const appRss = h.app ? Math.max(0, h.rss - h.sessions.reduce((n, x) => n + x.rss, 0)) : 0;
  const ports = s.ports.filter(p => h.pids.includes(p.pid) && !h.sessions.some(x => (x.pids || []).includes(p.pid)));
  let html = `<h1>${esc(h.name)} <span class="pill">agent</span></h1>
    <div class="sub"><span><b>${bytes(h.rss)}</b> in memory · <b>${pct(h.rss, s.system.total_mem)}</b> of RAM</span>${h.app ? `<span>the <b>${esc(h.app)}</b> app is <b>${bytes(appRss)}</b> of it</span>` : ""}<span><b>${h.cpu.toFixed(1)}%</b> cpu</span><span><b>${plural(live.length, "session")}</b></span><span><b>${stale.length}</b> stale</span><span><b>${plural(h.procs, "process")}</b></span>${trend ? `<span>${trend.growth >= 0 ? "grew" : "shrank"} <b>${bytes(Math.abs(trend.growth))}</b> over ${dur(trend.span_secs)}</span>` : ""}</div>
    <h2>Sessions <span class="tools">sort <select data-sess-sort>${["rss","idle","age","name"].map(k => `<option value="${k}" ${state.sessSort === k ? "selected" : ""}>${{rss:"memory",idle:"idle",age:"age",name:"name"}[k]}</option>`).join("")}</select>
      <button ${stale.length ? "" : "disabled"} data-close-stale="${esc(h.name)}">Close ${stale.length} stale</button></span></h2>
    <div class="wrap">${sessionTable(h.sessions)}</div>
    <p class="muted" style="margin-top:8px">Names come from the session's own title when it has one, otherwise the first thing you asked. Closing keeps the transcript on disk; the resume command is written to the action log. An app engine (Codex under the ChatGPT app or VS Code, Copilot under VS Code) is one process serving every thread the app shows; close those in the app.${h.app ? ` The ${esc(h.app)} app itself is counted here rather than as a holder of its own: it exists to run these sessions, and the ones in a terminal belong with them.` : ""}</p>`;
  if (ports.length) html += `<h2>Listening</h2>` + portsTable(ports);
  html += quitBlock(h);
  return html;
}

const SESSION_COLS = `<colgroup><col><col style="width:130px"><col style="width:76px"><col style="width:62px"><col style="width:74px"><col style="width:64px"><col style="width:90px"></colgroup>`;
function sessionTable(list) {
  return `<table class="fixed">${SESSION_COLS}<tr><th>Session</th><th>State</th><th class="num">Age</th><th class="num">CPU</th><th class="num">Memory</th><th class="num">Ports</th><th></th></tr>${sessionRows(list)}</table>`;
}

function tabTable(b, tabs) {
  const profiles = b.open_profiles.length > 1;
  const byDir = Object.fromEntries(b.open_profiles.map(p => [p.dir, p]));
  const cols = `<colgroup><col style="width:76px"><col><col style="width:164px">${profiles ? `<col style="width:150px">` : ""}<col style="width:90px"></colgroup>`;
  const rows = tabs.map(t => {
    const gone = goneTab(t);
    const idle = gone ? `<span class="muted">closed</span>` : t.active ? `<span class="state active">active</span>` : t.idle_secs != null ? dur(t.idle_secs) : `<span class="muted" title="opened in the background and never looked at">not viewed</span>`;
    const title = t.title.trim() || t.url;
    const p = byDir[t.profile];
    const profile = !profiles ? "" : p ? `<td><div class="l1">${esc(p.name)}</div>${p.label !== p.name && p.email ? `<div class="l2" title="${esc(p.email)}">${esc(p.email)}</div>` : ""}</td>` : `<td class="muted">${esc(t.profile)}</td>`;
    return `<tr class="${gone ? "gone" : ""}"><td class="num">${idle}</td><td class="main"><div class="l1" title="${esc(title)}">${esc(title)}${t.pinned ? `<span class="tag">pinned</span>` : ""}</div><div class="l2" title="${esc(t.url)}">${esc(t.url)}</div></td>
      <td title="${esc(t.site)}">${esc(t.site)}${kindTag(t.kind)}</td>${profile}<td class="num"><button ${b.can_close_tabs && !gone ? "" : "disabled"} data-close-tab="${t.id}" data-browser="${esc(b.name)}">Close</button></td></tr>`;
  }).join("");
  return `<table class="fixed">${cols}<tr><th class="num">Idle</th><th>Tab</th><th>Site</th>${profiles ? "<th>Profile</th>" : ""}<th></th></tr>${rows}</table>`;
}

function viewBrowser(h) {
  const s = state.snap, b = h.browser, est = b.per_tab_estimate;
  let html = `<h1>${esc(h.name)} <span class="pill">browser</span></h1>
    <div class="sub"><span><b>${bytes(h.rss)}</b> in memory · <b>${pct(h.rss, s.system.total_mem)}</b> of RAM</span><span><b>${h.cpu.toFixed(1)}%</b> cpu</span><span title="${b.extension_renderers} more renderers serve extensions${b.profiles != null ? `; ${b.profiles} profiles on disk` : ""}"><b>${bytes(b.renderer_rss)}</b> in <b>${b.renderers}</b> page renderers</span></div>`;
  if (!b.tabs.length) {
    return html + `<p class="note">No tabs to show. ${esc(b.tabs_note || "")}</p>` + quitBlock(h);
  }
  const live = b.tabs.filter(t => !goneTab(t));
  const stale = live.filter(t => isStale(b, t));
  const staleChat = stale.filter(t => t.kind === "chat" && !t.pinned);
  const staleChatIds = staleChat.map(t => t.id);
  const chat = live.filter(t => t.kind === "chat").length;
  const profiles = b.open_profiles.length > 1;
  const profileTabs = p => live.filter(t => t.profile === p.dir).length;
  html += `<p class="muted" style="margin:0 0 10px"><b>${live.length}</b> tabs, <b>${stale.length}</b> not looked at in over a day${est ? `, about ${bytes(est)} each` : ""}${chat ? `. <span title="chatgpt.com, claude.ai, gemini.google.com and friends: pages that keep the whole conversation in memory and grow with it"><b>${chat}</b> ${chat === 1 ? "is a conversation" : "are conversations"}, <b>${staleChat.length}</b> of them stale</span>` : ""}.</p>`;
  if (profiles) html += `<div class="chips">${b.open_profiles.map(p => `<span class="chip ${state.tabProfile === p.dir ? "sel" : ""}" data-profile="${esc(p.dir)}">${esc(p.label)} · ${profileTabs(p)}</span>`).join("")}</div>`;
  const growing = (s.trends || []).filter(t => t.kind === "renderer" && t.growth > 0 && t.span_secs >= 600 && (b.renderer_procs || []).some(r => `r:${r.pid}:${r.start_time}` === t.key)).sort((x, y) => y.growth - x.growth).slice(0, 5);
  if (growing.length) {
    html += `<h2>Pages growing <small class="muted">one renderer process each; Chrome does not say which tab</small></h2>
      <div class="wrap"><table><tr><th>Process</th><th class="num">Now</th><th class="num">Change</th><th class="num">Rate / h</th><th class="num">Over</th><th class="num">CPU</th></tr>` +
      growing.map(t => `<tr><td>${esc(t.name.replace(b.name, "").trim())}</td><td class="num">${bytes(t.rss_now)}</td><td class="num">+${bytes(t.growth)}</td><td class="num">+${bytes(Math.max(0, t.bytes_per_hour))}</td><td class="num">${dur(t.span_secs)}</td><td class="num">${t.cpu_mean.toFixed(0)}%</td></tr>`).join("") + `</table></div>
      <p class="muted" style="margin:6px 0 12px">A page that grows steadily and never comes back down is usually a long-lived web app: a conversation, mail, an editor, a local dev UI. Close it if you are done with it, or reload it to start the page over.</p>`;
  }
  html += `<h2>Worst offenders <small class="muted">by tabs you have not looked at</small></h2>
    <div class="wrap"><table class="fixed"><colgroup><col><col style="width:56px"><col style="width:56px"><col style="width:72px"><col style="width:90px"><col style="width:236px"></colgroup><tr><th>Site</th><th class="num">Tabs</th><th class="num">Stale</th><th class="num">Oldest</th><th class="num">≈ Memory</th><th></th></tr>` +
    sitesOf(b, live).slice(0, 12).map(st => {
      const closable = b.tabs.filter(t => t.site === st.site && !t.pinned && !t.active && !goneTab(t));
      const staleIds = closable.filter(t => isStale(b, t)).map(t => t.id);
      const allIds = closable.map(t => t.id);
      return `<tr><td class="main"><div class="l1">${esc(st.site)}${kindTag(st.kind)}</div></td><td class="num">${st.tabs}</td><td class="num ${st.stale_tabs ? "state stale" : "muted"}">${st.stale_tabs}</td><td class="num">${st.oldest_idle_secs != null ? dur(st.oldest_idle_secs) : "–"}</td><td class="num muted">${est ? bytes(st.est_rss) : "–"}</td>
        <td class="num"><button ${b.can_close_tabs && staleIds.length ? "" : "disabled"} data-close-tabs="${staleIds.join(",")}" data-browser="${esc(b.name)}">Close ${staleIds.length} stale</button> <button ${b.can_close_tabs && allIds.length ? "" : "disabled"} data-close-tabs="${allIds.join(",")}" data-browser="${esc(b.name)}">Close all ${allIds.length}</button></td></tr>`;
    }).join("") + `</table></div>`;
  let tabs = b.tabs.filter(t => !state.tabProfile || t.profile === state.tabProfile);
  const q = state.tabFilter.trim().toLowerCase();
  if (q) tabs = tabs.filter(t => (t.title + " " + t.url + " " + t.site).toLowerCase().includes(q));
  const idleOf = t => t.active ? -1 : (t.idle_secs ?? -0.5);
  tabs.sort((a, c) => state.tabSort === "site" ? a.site.localeCompare(c.site) || idleOf(c) - idleOf(a) : state.tabSort === "title" ? a.title.localeCompare(c.title) : state.tabSort === "window" ? a.window_id - c.window_id || a.index - c.index : idleOf(c) - idleOf(a));
  const staleUnpinned = stale.filter(t => !t.pinned && !goneTab(t)).map(t => t.id);
  html += `<h2>Tabs <span class="tools"><input data-tab-filter placeholder="filter title, url, site" value="${esc(state.tabFilter)}" size="24">
      <select data-tab-sort>${["idle","site","title","window"].map(k => `<option value="${k}" ${state.tabSort === k ? "selected" : ""}>${{idle:"longest untouched",site:"site",title:"title",window:"window order"}[k]}</option>`).join("")}</select>
      <button ${b.can_close_tabs && staleUnpinned.length ? "" : "disabled"} data-close-tabs="${staleUnpinned.join(",")}" data-browser="${esc(b.name)}" title="every unpinned tab not looked at in over a day, in every open profile">Close all ${staleUnpinned.length} stale</button>
      ${chat ? `<button ${b.can_close_tabs && staleChatIds.length ? "" : "disabled"} data-close-tabs="${staleChatIds.join(",")}" data-browser="${esc(b.name)}" title="unpinned conversation tabs (chatgpt.com, claude.ai, …) not looked at in over a day; the service keeps the conversation">Close ${staleChatIds.length} stale conversation${staleChatIds.length === 1 ? "" : "s"}</button>` : ""}</span></h2>
    <div class="wrap">${tabTable(b, tabs)}</div>
    <p class="muted" style="margin-top:8px">Idle is how long since the tab was last in front, from the browser's own session records. ${b.can_close_tabs ? "Close asks the browser to close that exact tab; ⌘⇧T brings it back and the URL is in the action log." : "Closing tabs is not available on this platform yet."} Chrome does not publish per-tab memory, so the ≈ figures split renderer memory evenly across tabs; conversation pages usually sit well above that, and the service keeps the history when one is closed.</p>`;
  return html + quitBlock(h);
}

function isStale(b, t) { return !t.active && !goneTab(t) && t.idle_secs != null && t.idle_secs >= 86400; }

// Tabs rolled up by site, worst first, from the tabs given (the live ones),
// so the table follows a close at once instead of waiting for a snapshot.
function sitesOf(b, tabs) {
  const by = new Map();
  for (const t of tabs) {
    const s = by.get(t.site) || { site: t.site, kind: t.kind, tabs: 0, stale_tabs: 0, oldest_idle_secs: null, est_rss: 0 };
    s.tabs++; if (isStale(b, t)) s.stale_tabs++;
    if (!t.active && t.idle_secs != null && (s.oldest_idle_secs == null || t.idle_secs > s.oldest_idle_secs)) s.oldest_idle_secs = t.idle_secs;
    s.est_rss = s.tabs * (b.per_tab_estimate || 0);
    by.set(t.site, s);
  }
  return [...by.values()].sort((a, c) => c.stale_tabs - a.stale_tabs || c.tabs - a.tabs || (c.oldest_idle_secs ?? -1) - (a.oldest_idle_secs ?? -1) || a.site.localeCompare(c.site));
}

// Remember what was closed from here until a snapshot no longer lists it.
function markGone(kind, ids, recs, ok) {
  const set = state.gone[kind];
  recs.forEach((r, i) => { if (ok(r) && ids[i] != null) set.add(ids[i]); });
}
function pruneGone(snap) {
  const tabs = new Set(snap.browsers.flatMap(b => b.tabs.map(t => t.id)));
  const pids = new Set(snap.sessions.map(x => x.pid));
  state.gone.tabs.forEach(id => { if (!tabs.has(id)) state.gone.tabs.delete(id); });
  state.gone.pids.forEach(p => { if (!pids.has(p)) state.gone.pids.delete(p); });
}

function quitBlock(h) {
  const s = state.snap;
  // An agent group quits the app folded into it; anything else quits itself.
  const app = h.kind === "agent" ? h.app : h.kind === "app" || h.kind === "browser" ? h.name : null;
  if (!app) return "";
  const hosting = s.sessions.filter(x => x.host_app === app);
  const self = s.sessions.some(x => x.is_self && x.host_app === app);
  const never = ["Finder", "autoTrim", "autotrim-tray"].includes(app);
  let why = "";
  if (never) why = "this is not something autoTrim quits";
  else if (self) why = "this app is running the session autoTrim is in";
  else if (hosting.length) why = `hosts ${plural(hosting.length, "agent session")}; close those first`;
  const back = h.kind === "browser" ? "with its last session, so tabs come back as you click them" : "so it comes back holding far less";
  return `<h2>Quit or restart</h2><div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button ${why ? "disabled" : ""} data-quit="${esc(app)}">Quit ${esc(app)}</button><button ${why ? "disabled" : ""} data-restart="${esc(app)}">Restart ${esc(app)}</button><span class="muted">${why ? esc(why) : `Quit asks the app to quit the way ⌘Q would, so it can prompt to save. Restart does the same, waits for it to exit, and opens it again ${back}. Both are logged with the command to reopen it.`}</span></div>`;
}

function viewApp(h) {
  const s = state.snap;
  const hosted = s.sessions.filter(x => x.host_app === h.name);
  const trend = (s.trends || []).find(t => t.key === "g:" + h.name && t.span_secs >= 600);
  const ports = s.ports.filter(p => h.pids.includes(p.pid));
  let html = `<h1>${esc(h.name)} <span class="pill">${h.kind === "app" ? "app" : "process"}</span></h1>
    <div class="sub"><span><b>${bytes(h.rss)}</b> in memory · <b>${pct(h.rss, s.system.total_mem)}</b> of RAM</span><span><b>${h.cpu.toFixed(1)}%</b> cpu</span><span><b>${plural(h.procs, "process")}</b></span>${trend ? `<span>${trend.growth >= 0 ? "grew" : "shrank"} <b>${bytes(Math.abs(trend.growth))}</b> over ${dur(trend.span_secs)}</span>` : ""}</div>`;
  if (hosted.length) {
    html += `<h2>Agent sessions it hosts</h2><div class="wrap">${sessionTable(hosted)}</div>`;
  }
  if (ports.length) {
    html += `<h2>Listening</h2>` + portsTable(ports);
  }
  if (h.kind === "other") {
    html += `<p class="note">A bare executable rather than an app bundle: ${plural(h.procs, "process")} named ${esc(h.name)}, ${bytes(h.rss)} between them. autoTrim only stops these when they are a forgotten local server (see Listening ports).</p>`;
  }
  if (!hosted.length && !ports.length && h.kind === "app") {
    html += `<p class="note">${plural(h.procs, "process")} under this app bundle, ${bytes(h.rss)} in memory between them.</p>`;
  }
  return html + quitBlock(h);
}

function portsTable(list) {
  return `<div class="wrap"><table><tr><th class="num">Port</th><th>Proto</th><th>Addr</th><th class="num">Open</th><th>What</th><th>Owner</th><th>Process</th><th></th></tr>` +
    list.map(p => `<tr><td class="num">${p.port}</td><td>${p.protocol}</td><td>${esc(p.addr)}</td><td class="num">${dur(p.open_for_secs)}</td><td title="${esc(p.label_source || "")}">${esc(p.label || "?")}</td><td>${esc(p.owner)}</td><td>${esc(p.process)} <span class="muted">(${p.pid})</span></td><td class="num"><button ${p.owner_managed ? "disabled" : ""} data-stop="${p.pid}" title="${p.owner_managed ? "managed by its app or the system" : "stop this process"}">Stop</button></td></tr>`).join("") + `</table></div>`;
}

function viewPorts() {
  const s = state.snap;
  return `<h1>Listening ports</h1><div class="sub"><span><b>${s.ports.length}</b> open</span><span><b>${s.ports.filter(p => !p.owner_managed).length}</b> unmanaged: started from a terminal or script, nothing will restart them</span></div>` + (s.ports.length ? portsTable(s.ports) : `<p class="note">Nothing is listening.</p>`);
}

function recoveryDetails(r) {
  const command = r.resume || "";
  // Tab recovery tips are stored as trailing shell comments in existing logs.
  // Only split outside quotes, so a matching phrase inside a URL stays intact.
  if (r.action === "close_tab") {
    const hintPrefix = "   # or ";
    let quote = "";
    for (let i = 0; i < command.length; i++) {
      const c = command[i];
      if (c === "\\" && quote !== "'") { i++; continue; }
      if (quote) { if (c === quote) quote = ""; continue; }
      if (c === "'" || c === '"') { quote = c; continue; }
      if (command.startsWith(hintPrefix + "⌘⇧T in the ", i)) {
        return { command: command.slice(0, i), hint: "Or press " + command.slice(i + hintPrefix.length) };
      }
    }
  }
  return { command, hint: "" };
}

function recoveryControl(r) {
  const { command, hint } = recoveryDetails(r);
  if (!command) return "";
  return `<br><button type="button" class="copy-command" data-copy-command title="Copy to clipboard" aria-label="Copy recovery command for ${esc(r.target)}: ${esc(command)}">
    <code>${esc(command)}</code><span aria-hidden="true">Copy</span>
  </button>${hint ? `<div class="muted recovery-hint">${esc(hint)}</div>` : ""}`;
}

function viewActions() {
  const rows = state.log.slice().reverse().map(r => `<div>
    <span class="muted">${new Date(r.ts * 1000).toLocaleString()}</span> <span class="tag">${esc(r.mode)}</span>
    ${esc(r.action.replace(/_/g, " "))} · ${esc(r.target)} · ${esc(r.result)}${recoveryControl(r)}
  </div>`).join("");
  return `<h1>Actions</h1><div class="sub"><span>Everything autoTrim has done, newest first, with how to get it back.</span></div><div class="card log">` +
    (rows || `<span class="muted">nothing yet</span>`) + `</div>`;
}

function renderMain(viewChanged) {
  const main = document.getElementById("main");
  const active = document.activeElement;
  if (!viewChanged && active && active.hasAttribute("data-tab-filter")) return; // typing; leave it alone
  // Keep the clicked command in place until its local copy feedback ends.
  if (!viewChanged && state.view === "actions" && main.querySelector(".copy-command.copying, .copy-command.copy-feedback")) return;
  const scroll = viewChanged ? 0 : main.scrollTop;
  let html;
  const v = state.view;
  if (v === "overview") html = viewOverview();
  else if (v === "ports") html = viewPorts();
  else if (v === "actions") html = viewActions();
  else if (v === "settings") html = viewSettings();
  else {
    const h = holderByKey(v);
    if (!h) { state.view = "overview"; html = viewOverview(); renderSide(); }
    else if (h.kind === "agent") html = viewAgents(h);
    else if (h.browser) html = viewBrowser(h);
    else html = viewApp(h);
  }
  main.innerHTML = html;
  main.scrollTop = scroll;
  wire(main);
}

function wire(root) {
  root.querySelectorAll("[data-copy-command]").forEach(b => b.onclick = () => copyCommand(b));
  root.querySelectorAll("[data-goto]").forEach(a => a.onclick = () => { state.view = a.dataset.goto; renderSide(); renderMain(true); });
  // A row is gone when the action closed it, and just as gone when the
  // action found it already closed: either way it should stop being listed.
  const sessionGone = r => /^(terminated|killed|already gone)/.test(r.result);
  const tabOk = r => r.result === "closed";
  const tabGone = r => tabOk(r) || /already gone|not open any more/.test(r.result);
  root.querySelectorAll("[data-close-session]").forEach(b => b.onclick = () => twoStep(b, "s" + b.dataset.closeSession, async () => { const pid = +b.dataset.closeSession; const rec = await invoke("close_session", { pid, force: false }); markGone("pids", [pid], [rec], sessionGone); report(rec); }));
  root.querySelectorAll("[data-stop]").forEach(b => b.onclick = () => twoStep(b, "p" + b.dataset.stop, async () => report(await invoke("stop_server", { pid: +b.dataset.stop, force: false }))));
  root.querySelectorAll("[data-close-tab]").forEach(b => b.onclick = () => twoStep(b, "t" + b.dataset.closeTab, async () => { const ids = [+b.dataset.closeTab]; const recs = await invoke("close_tabs", { browser: b.dataset.browser, ids }); markGone("tabs", ids, recs, tabGone); report(recs); }));
  root.querySelectorAll("[data-close-tabs]").forEach(b => b.onclick = () => { const ids = b.dataset.closeTabs.split(",").filter(Boolean).map(Number); if (!ids.length) return; twoStep(b, "T" + b.dataset.closeTabs, async () => { const recs = await invoke("close_tabs", { browser: b.dataset.browser, ids }); markGone("tabs", ids, recs, tabGone); const ok = recs.filter(tabOk).length; toast(`closed ${ok} of ${recs.length} tabs` + (ok < recs.length ? "\n" + recs.filter(r => !tabOk(r)).map(r => `${r.target}: ${r.result}`).join("\n") : "")); }); });
  root.querySelectorAll("[data-close-stale]").forEach(b => b.onclick = () => { const h = holderByKey("g:" + b.dataset.closeStale); const pids = h ? h.sessions.filter(x => x.state === "stale" && !x.is_self && !x.engine && !goneSession(x)).map(x => x.pid) : []; twoStep(b, "S" + b.dataset.closeStale, async () => { const out = []; for (const pid of pids) { try { const rec = await invoke("close_session", { pid, force: false }); markGone("pids", [pid], [rec], sessionGone); out.push(rec); } catch (e) { out.push({ action: "close_session", target: `pid ${pid}`, result: String(e) }); } } report(out); }); });
  root.querySelectorAll("[data-quit]").forEach(b => b.onclick = () => twoStep(b, "q" + b.dataset.quit, async () => report(await invoke("quit_app", { name: b.dataset.quit, force: false }))));
  root.querySelectorAll("[data-restart]").forEach(b => b.onclick = () => twoStep(b, "r" + b.dataset.restart, async () => report(await invoke("restart_app", { name: b.dataset.restart, force: false }))));
  // The switches write config.toml; the daemon picks it up on its next tick.
  root.querySelectorAll("[data-auto]").forEach(cb => cb.onchange = async () => { cb.disabled = true; try { state.settings = await invoke("set_auto", { [cb.dataset.auto]: cb.checked }); } catch (e) { toast(String(e)); } refresh(); });
  root.querySelectorAll("[data-launch-window]").forEach(cb => cb.onchange = async () => { cb.disabled = true; try { state.settings = await invoke("set_open_window_at_launch", { value: cb.checked }); } catch (e) { toast(String(e)); } refresh(); });
  root.querySelectorAll("[data-hide]").forEach(b => b.onclick = () => invoke("hide_window").catch(e => toast(String(e))));
  root.querySelectorAll("[data-service]").forEach(b => {
    const what = b.dataset.service;
    const run = async () => { state.service = await invoke("service_" + what); toast(what === "install" ? "Installed the login service. The daemon runs now and at every login." : what === "restart" ? "The daemon was restarted." : "Removed the login service; the daemon has stopped. Its data is kept."); };
    if (what === "uninstall") b.onclick = () => twoStep(b, "svc", run);
    else b.onclick = () => { b.disabled = true; b.textContent = "…"; run().catch(e => toast(String(e))).finally(() => refresh()); };
  });
  root.querySelectorAll("[data-profile]").forEach(c => c.onclick = () => { state.tabProfile = state.tabProfile === c.dataset.profile ? "" : c.dataset.profile; renderMain(true); });
  root.querySelectorAll("[data-tab-sort]").forEach(sel => sel.onchange = () => { state.tabSort = sel.value; renderMain(true); });
  root.querySelectorAll("[data-sess-sort]").forEach(sel => sel.onchange = () => { state.sessSort = sel.value; renderMain(true); });
  root.querySelectorAll("[data-tab-filter]").forEach(inp => {
    inp.oninput = () => { state.tabFilter = inp.value; const pos = inp.selectionStart; renderMain(true); const again = document.querySelector("[data-tab-filter]"); if (again) { again.focus(); again.setSelectionRange(pos, pos); } };
  });
}

function renderAll(viewChanged) { renderHeader(); renderSide(); renderMain(viewChanged); }

// `fresh` asks the app to scan now instead of reading the daemon's last
// tick. What is on screen is never replaced by something older, so a fresh
// scan taken after an action stays until the daemon catches up with it.
async function refresh(opts = {}) {
  sync.lastPoll = Date.now();
  if (opts.fresh) { sync.scans++; if (state.snap && state.src) renderHeader(); }
  let snap, src, log, settings, service;
  try {
    [snap, src, log, settings, service] = await Promise.all([invoke("snapshot", { fresh: !!opts.fresh }), invoke("source_info"), invoke("action_log").catch(() => []), invoke("settings").catch(() => null), invoke("service_info").catch(() => null)]);
  } catch (e) { document.getElementById("head").innerHTML = `<span class="muted">${esc(String(e))}</span>`; return; }
  finally { if (opts.fresh) sync.scans--; }
  const first = !state.snap;
  if (!first && snap.taken_at < state.snap.taken_at) { state.src = src; state.log = log; state.settings = settings; state.service = service; renderAll(false); return; }
  state.snap = snap; state.src = src; state.log = log; state.settings = settings; state.service = service;
  pruneGone(snap);
  renderAll(first);
}
refresh();
setInterval(tickSync, 1000);
</script>
</body>
</html>
