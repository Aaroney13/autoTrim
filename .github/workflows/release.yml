name: Release macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autotrim-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      release-id: ${{ steps.release.outputs.releaseId }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Assign the next app version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-release.mjs
      - name: Validate release version and signing configuration
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node scripts/check-release.mjs "$RELEASE_TAG"
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Missing TAURI_SIGNING_PRIVATE_KEY secret'; exit 1; }
      - name: Install signature verifier
        run: brew install minisign
      - name: Verify
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          node --test tests/*.test.mjs
      - name: Prepare universal daemon
        run: bash scripts/prepare-bundle.sh universal-apple-darwin
      - name: Configure optional Apple signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PYENV'
          import os, uuid
          names = ['APPLE_CERTIFICATE', 'APPLE_CERTIFICATE_PASSWORD', 'APPLE_SIGNING_IDENTITY', 'APPLE_ID', 'APPLE_PASSWORD', 'APPLE_TEAM_ID']
          values = {name: os.environ.get(name, '') for name in names}
          if not any(values.values()):
              values = {'APPLE_SIGNING_IDENTITY': '-'}
          elif not all(values.values()):
              raise SystemExit('Configure all six Apple signing secrets, or leave all unset for ad-hoc testing builds')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for name, value in values.items():
                  delimiter = uuid.uuid4().hex
                  output.write(f'{name}<<{delimiter}\n{value}\n{delimiter}\n')
          PYENV
      - uses: tauri-apps/tauri-action@v1
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: tray
          tagName: v__VERSION__
          releaseCommitish: ${{ github.sha }}
          releaseName: autoTrim v__VERSION__
          releaseBody: 'Download the DMG to install autoTrim. Existing installations with the updater can install this version from Settings → App updates.'
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin --bundles app,dmg --config tauri.release.conf.json
      - name: Verify uploaded updater before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ID: ${{ steps.release.outputs.releaseId }}
        run: |
          mkdir -p release-check
          gh release download "$RELEASE_TAG" --dir release-check --pattern latest.json --pattern '*.app.tar.gz' --pattern '*.dmg'
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release-check/release.json
          node scripts/verify-update.mjs release-check "$RELEASE_VERSION"
          tar -xzf release-check/*.app.tar.gz -C release-check
          lipo release-check/autoTrim.app/Contents/MacOS/autotrim-tray -verify_arch arm64 x86_64
          lipo release-check/autoTrim.app/Contents/MacOS/autotrim -verify_arch arm64 x86_64
          test "$(release-check/autoTrim.app/Contents/MacOS/autotrim --version)" = "autotrim $RELEASE_VERSION"
          (cd release-check && shasum -a 256 latest.json *.app.tar.gz *.dmg > SHA256SUMS)
      - name: Save verified release checksums
        uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: release-check/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Summarize release awaiting approval
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          printf '### Ready for release approval\n\nVersion: `%s`\n\nCommit: `%s`\n\nReview the draft on the [Releases page](https://github.com/%s/releases), then approve the **production** deployment on this workflow run.\n' \
            "$RELEASE_TAG" "$GITHUB_SHA" "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Approve and publish app update
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_ID: ${{ needs.build.outputs.release-id }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Check whether main has advanced while awaiting approval
        id: current
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$RELEASE_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer commit is on main; leaving this build as a draft.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download verified release checksums
        if: steps.current.outputs.current == 'true'
        uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: release-check
      - name: Publish the approved, unchanged update
        if: steps.current.outputs.current == 'true'
        run: |
          set -euo pipefail
          # Re-download after approval: the draft may have waited for days.
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release-check/release.json
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$RELEASE_SHA" \
            '.draft == true and .tag_name == $tag and .target_commitish == $sha' release-check/release.json
          gh release download "$RELEASE_TAG" --dir release-check --pattern latest.json --pattern '*.app.tar.gz' --pattern '*.dmg'
          (cd release-check && sha256sum --check SHA256SUMS)
          # Check again immediately before promotion, after the downloads.
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$RELEASE_SHA" ]; then
            echo 'A newer commit is on main; leaving this build as a draft.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true --silent
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" \
            --output release-check/public-latest.json
          cmp release-check/latest.json release-check/public-latest.json
          printf 'Published [%s](https://github.com/%s/releases/tag/%s) after production approval.\n' \
            "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
