const workspace=document.getElementById('workspace');
const eligible=r=>!r.protected;
function visible(){let rows=data[app].rows.filter(r=>(scope==='all'||r.profile===scope)&&(!query||`${r.title} ${r.location} ${r.profile}`.toLowerCase().includes(query.toLowerCase()))&&(filter==='all'||filter==='cleanup'&&r.state==='stale'&&eligible(r)||filter==='stale'&&r.state==='stale'||filter==='active'&&r.state==='active'));return rows.sort((a,b)=>sort==='name'?a.title.localeCompare(b.title):sort==='recent'?a.hours-b.hours:b.hours-a.hours)}
function search(){return `<label class="search">${svg('search')}<input type="search" id="search" aria-label="${data[app].placeholder}" placeholder="${data[app].placeholder}" value="${esc(query)}"></label>`}
function status(){return `<select class="control" data-filter aria-label="Filter by activity">${[['all','All activity'],['stale','Older items'],['active','Active']].map(([v,l])=>`<option value="${v}" ${filter===v?'selected':''}>${l}</option>`).join('')}</select>`}
function sorting(){return `<select class="control" data-sort aria-label="Sort items">${[['oldest','Oldest first'],['recent','Recent first'],['name','Name A–Z']].map(([v,l])=>`<option value="${v}" ${sort===v?'selected':''}>${l}</option>`).join('')}</select>`}
function options(){return `<details class="options"><summary aria-label="View options" title="View options">${svg('options')}</summary><div class="options-panel"><label>Order${sorting()}</label><label>${app==='chrome'?'Profile':'Host'}<select class="control" data-scope>${['all',...new Set(data[app].rows.map(r=>r.profile))].map(v=>`<option value="${esc(v)}" ${scope===v?'selected':''}>${v==='all'?'All':esc(v)}</option>`).join('')}</select></label></div></details>`}
function item(r){return `<li><div class="item ${selected.has(r.id)?'checked':''}">${eligible(r)?`<input class="select-item" type="checkbox" data-select="${r.id}" aria-label="Select ${esc(r.title)}" ${selected.has(r.id)?'checked':''}>`:'<span class="selection-space" aria-hidden="true"></span>'}<span class="item-icon ${r.tone}" aria-hidden="true">${r.mark}</span><div class="item-main"><button class="item-title" data-details="${r.id}" aria-expanded="${expanded===r.id}">${esc(r.title)}</button><div class="item-meta"><span class="location">${esc(r.location)}</span><span>${esc(r.profile)}</span>${design==='inbox'?`<span>${esc(r.memory)}</span>`:''}</div></div><span class="row-note ${r.state}">${esc(r.age)}</span><button class="item-info" data-details="${r.id}" aria-label="Details for ${esc(r.title)}" aria-expanded="${expanded===r.id}">${svg('info')}</button></div>${expanded===r.id?`<div class="inline-detail"><p>${esc(r.memory)} ${r.memory==='Shared backend'?'— individual task usage is unavailable.':'footprint.'} ${r.protected?(app==='codex'?'This task is managed by the Codex app.':'This tab or session is protected.'):'This item can be reviewed for closing.'}</p>${eligible(r)?`<button class="button" data-review-one="${r.id}">Review ${app==='chrome'?'tab':'session'}</button>`:`<p>${app==='codex'?'Manage loaded tasks in Codex.':r.age==='Pinned'?'Pinned tabs stay open.':'Active work stays open.'}</p>`}</div>`:''}</li>`}
function render(){const d=data[app],rows=visible(),reviewable=rows.filter(r=>eligible(r)&&r.state==='stale'),cleanup=d.rows.filter(r=>eligible(r)&&r.state==='stale');selected=new Set([...selected].filter(id=>rows.some(r=>r.id===id&&eligible(r))));workspace.dataset.design=design;
document.getElementById('description').innerHTML=descriptions[design];document.getElementById('design-note').innerHTML=notes[design];
document.querySelectorAll('[data-direction]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.direction===design));document.querySelectorAll('[data-app]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.app===app));
let headActions=design==='groups'?`<button class="icon-button" data-search-toggle aria-label="${searchOpen?'Hide':'Show'} search" aria-expanded="${searchOpen}">${svg(searchOpen?'close':'search')}</button>${options()}`:design==='quiet'?`<button class="button" data-review-older ${reviewable.length?'':'disabled'}>Review ${reviewable.length} older</button>`:'';
let html=`<div class="page-head"><span class="app-icon ${app==='chrome'?'chrome':app==='claude'?'claude':''}" aria-hidden="true">${app==='chrome'?'':app==='codex'?'⌘':'✳'}</span><div><h2>${d.name}</h2><p>${d.memory} footprint &nbsp; / &nbsp; ${d.summary}</p></div><div class="head-actions">${headActions}</div></div>`;
if(design==='quiet')html+=`<div class="toolbar">${search()}<span class="search-divider"></span>${status()}${options()}</div>`;
if(design==='groups')html+=`<div class="toolbar">${searchOpen?search():`<span class="selection-count">${new Set(rows.map(r=>r.group)).size} ${app==='chrome'?'websites':'projects'}</span>`}<span class="spacer"></span>${status()}</div>`;
if(design==='inbox'){html+=`<div class="inbox-controls"><div class="segments" role="group" aria-label="View">${[['cleanup','To review',cleanup.length],['all','All',d.rows.length],['active','Active',d.rows.filter(r=>r.state==='active').length]].map(([v,l,n])=>`<button data-inbox="${v}" aria-pressed="${filter===v}">${l}<span class="count">${n}</span></button>`).join('')}</div>${search()}${options()}</div><div class="queue-intro"><div><h3>${filter==='cleanup'?'Ready for a look':filter==='active'?'Work in progress':'Your current workload'}</h3><p>${filter==='cleanup'?'Older items you can close after a review.':filter==='active'?'Active work stays protected.':'Older and recent items, together.'}</p></div>${filter==='cleanup'&&rows.length?'<button class="button" data-select-visible>Select all</button>':''}</div>`;}
if(!rows.length)html+='<p class="empty">No matching items. Try a different search or activity filter.</p>';
else if(design==='groups'){for(const group of [...new Set(rows.map(r=>r.group))]){const entries=rows.filter(r=>r.group===group);html+=`<details class="group" open data-group="${esc(group)}"><summary><strong>${esc(group)}</strong><span class="group-count">${entries.length} ${app==='chrome'?'tabs':'items'}</span></summary><ul class="list">${entries.map(item).join('')}</ul></details>`;}}
else html+=`<ul class="list ${design==='inbox'?'queue-list':''}">${rows.map(item).join('')}</ul>`;
html+=`<div id="selection-slot"></div><p class="footnote">${d.note}</p>`;workspace.innerHTML=html;renderSelection();}
function renderSelection(){const slot=document.getElementById('selection-slot');slot.innerHTML=selected.size?`<div class="selection" role="status"><span>${selected.size} selected</span><div class="actions"><button data-clear>Clear</button><button class="button primary" data-review-selected>Review selected</button></div></div>`:'';workspace.querySelectorAll('[data-select]').forEach(el=>{el.checked=selected.has(+el.dataset.select);el.closest('.item').classList.toggle('checked',el.checked)})}
function refreshPreserving(){const focused=document.activeElement,searchFocused=focused?.id==='search',detailId=focused?.dataset.details;const groups=[...workspace.querySelectorAll('.group')].filter(el=>!el.open).map(el=>el.dataset.group);render();for(const g of workspace.querySelectorAll('.group'))if(groups.includes(g.dataset.group))g.open=false;if(searchFocused)document.getElementById('search')?.focus({preventScroll:true});else if(detailId)workspace.querySelector(`[data-details="${detailId}"]`)?.focus({preventScroll:true})}
function review(rows){if(!rows.length)return;document.getElementById('review-description').textContent=`${rows.length} ${rows.length===1?'item':'items'} would be reviewed here. This preview does not close anything or connect to your apps.`;document.getElementById('review-items').innerHTML=rows.map(r=>`<li>${esc(r.title)}</li>`).join('');document.getElementById('review').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.direction){design=b.dataset.direction;filter=design==='inbox'?'cleanup':'all';query='';scope='all';selected.clear();expanded=null;searchOpen=false;render();return}if(b.dataset.app){app=b.dataset.app;filter=design==='inbox'?'cleanup':'all';query='';scope='all';selected.clear();expanded=null;render();return}if(b.hasAttribute('data-search-toggle')){searchOpen=!searchOpen;if(!searchOpen)query='';render();if(searchOpen)document.getElementById('search').focus()}if(b.dataset.details){expanded=expanded===+b.dataset.details?null:+b.dataset.details;refreshPreserving()}if(b.dataset.inbox){filter=b.dataset.inbox;selected.clear();render()}if(b.hasAttribute('data-select-visible')){visible().filter(eligible).forEach(r=>selected.add(r.id));renderSelection()}if(b.hasAttribute('data-clear')){selected.clear();renderSelection()}if(b.hasAttribute('data-review-selected'))review(visible().filter(r=>selected.has(r.id)));if(b.hasAttribute('data-review-older'))review(visible().filter(r=>eligible(r)&&r.state==='stale'));if(b.dataset.reviewOne)review(data[app].rows.filter(r=>r.id===+b.dataset.reviewOne&&eligible(r)))});
workspace.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;refreshPreserving()}});
workspace.addEventListener('change',e=>{const el=e.target;if(el.dataset.select){el.checked?selected.add(+el.dataset.select):selected.delete(+el.dataset.select);renderSelection();return}if(el.hasAttribute('data-filter'))filter=el.value;if(el.hasAttribute('data-sort'))sort=el.value;if(el.hasAttribute('data-scope'))scope=el.value;render()});
document.getElementById('cancel-review').onclick=()=>document.getElementById('review').close();document.getElementById('finish-review').onclick=()=>document.getElementById('review').close();
render();
</script>
</body>
</html>
